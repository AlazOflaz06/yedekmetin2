<title>Metin Avcısı 3D - MMORPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0908;
  --panel:#171310;
  --panel2:#221b16;
  --line:#3a2e25;
  --gold:#d9a441;
  --blood:#c0392f;
  --jade:#3f9a82;
  --mana:#4a78c9;
  --text:#eadfce;
  --mute:#a09280;
  --font-display:'Philosopher',Georgia,'Times New Roman',serif;
  --font-body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--bg);touch-action:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg{position:absolute;left:0;top:0;font-weight:600;font-size:15px;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;will-change:transform,opacity}
.dmg.big{font-size:22px;font-weight:700}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
h3{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0 0 8px;color:var(--gold);letter-spacing:.02em}

/* Kafa Üstü Etiketler */
.mobLabel{
  position:absolute;
  font-family:var(--font-display);
  font-weight:700;
  font-size:11px;
  color:#fff;
  text-shadow:0 1px 3px #000, 0 0 5px #000;
  pointer-events:none;
  transform:translate(-50%,-100%);
  white-space:nowrap;
  z-index:4;
  background:rgba(13,11,10,0.75);
  padding:1px 6px;
  border-radius:3px;
  border:1px solid rgba(217,164,65,0.4);
  display:none;
}
.mobLabel b{color:var(--gold)}
.mobLabel.metin{border-color:#b88cf5;color:#e8d8ff}

#playerLabel{
  position:absolute;
  font-family:var(--font-display);
  font-weight:700;
  font-size:13px;
  color:#fff;
  text-shadow:0 1px 3px #000, 0 0 6px #000;
  pointer-events:none;
  transform:translate(-50%,-100%);
  white-space:nowrap;
  z-index:5;
  background:rgba(13,11,10,0.85);
  padding:2px 8px;
  border-radius:4px;
  border:1px solid rgba(217,164,65,0.7);
}
#playerLabel b{color:var(--gold)}

/* Giriş ve Slot Seçim Ekranı */
#loginScreen{position:absolute;inset:0;background:rgba(13,11,10,0.96);display:flex;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(8px)}
.login-box{background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:24px;width:min(520px,94vw);box-shadow:0 10px 35px rgba(0,0,0,0.9);text-align:center}
.login-box h2{font-family:var(--font-display);color:var(--gold);font-size:28px;margin:0 0 14px;letter-spacing:1px}
.login-box input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--gold);font-family:var(--font-display);font-size:15px;text-align:center;box-sizing:border-box;margin-bottom:10px;outline:none}
.login-box input:focus{border-color:var(--gold)}

.char-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 20px}
.char-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.char-card:hover,.char-card.on{border-color:var(--gold);background:#2c221b;box-shadow:0 0 12px rgba(217,164,65,0.35)}
.char-avatar{width:48px;height:48px;border-radius:50%;background:#110e0c;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.char-info{flex:1;min-width:0}
.char-info b{display:block;font-family:var(--font-display);color:var(--gold);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-info span{display:block;font-size:11px;color:var(--mute)}
.char-info small{display:block;font-size:10px;color:var(--jade);margin-top:2px}

#top{position:absolute;top:12px;left:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:rgba(27,22,19,.85);border:1px solid var(--line);padding:8px 12px;border-radius:4px;max-width:calc(100% - 140px)}
#top b{font-family:var(--font-display);font-size:17px;color:var(--gold)}
#top span{color:var(--mute)}
#top .gold{color:var(--gold);font-variant-numeric:tabular-nums}

#target{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:min(260px,40vw);background:rgba(27,22,19,.9);border:1px solid var(--line);padding:8px 10px;border-radius:4px;text-align:center}
#target .nm{font-family:var(--font-display);font-size:15px;margin-bottom:5px}

.bar{height:12px;background:#0a0807;border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .12s}
.bar em{position:absolute;inset:0;font-style:normal;font-size:10px;line-height:11px;text-align:center;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 1px #000}
.hp i{background:linear-gradient(#d9473b,#9c241b)}
.mp i{background:linear-gradient(#5a89de,#35599b)}
.xp i{background:linear-gradient(#e0b24a,#a87a1e)}
.tg i{background:linear-gradient(#d9473b,#9c241b)}

#hud{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 24px));display:flex;flex-direction:column;gap:6px;background:rgba(27,22,19,.92);border:1px solid var(--line);padding:10px;border-radius:4px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#bars{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#bars .xp{grid-column:1/-1;height:8px}
#skills{display:flex;gap:6px;flex-wrap:wrap}
.sk{position:relative;flex:1 1 0;min-width:55px;padding:6px 2px;text-align:center;font-size:11px;overflow:hidden;line-height:1.2}
.sk kbd{display:block;font-family:var(--font-display);font-weight:700;color:var(--gold);font-size:12px}
.sk small{display:block;color:var(--mute);font-size:9px}
.sk .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.7);pointer-events:none}
.sk .lv{position:absolute;top:2px;right:3px;font-size:9px;color:var(--jade)}
.sk.on{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}
.sk.lock{opacity:.4}
.sk.pot{flex:.8 1 0}

#menuBtns{position:absolute;top:12px;right:16px;display:flex;gap:8px}
#menuBtn,#switchCharBtn{padding:8px 12px;background:var(--panel);font-family:var(--font-display);font-weight:700;font-size:13px}

#panel{position:absolute;top:0;right:0;bottom:0;width:min(390px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:10;padding-top:env(safe-area-inset-top,0px)}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:12px 2px;font-family:var(--font-display);font-weight:700;font-size:11px;color:var(--mute);border-bottom:2px solid transparent}
#tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
#pbody{flex:1;overflow-y:auto;padding:14px;min-height:0;touch-action:pan-y}
#pclose{margin:10px 14px 14px;width:calc(100% - 28px)}

.equipment-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row .nm{flex:1 1 120px;min-width:0;font-weight:500}
.row .st{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.row button{padding:4px 8px;font-size:12px}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:4px}
.slot .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.slot .nm{font-family:var(--font-display);font-size:14px;margin:2px 0}
.msg{margin:10px 0;padding:8px 10px;border-radius:4px;background:var(--panel2);border-left:3px solid var(--gold);font-size:13px}
.msg.bad{border-left-color:var(--blood)}
.msg.good{border-left-color:var(--jade)}
.note{color:var(--mute);font-size:12px;margin:8px 0}
.skrow{padding:10px 0;border-bottom:1px solid var(--line)}
.skrow .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.skrow .h b{font-family:var(--font-display);font-size:15px;color:var(--text)}
.skrow .d{color:var(--mute);font-size:12px;margin:3px 0 6px}
table.stats{width:100%;border-collapse:collapse}
table.stats td{padding:6px 0;border-bottom:1px solid var(--line)}
table.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums}

.stat-btn{padding:2px 8px;font-size:14px;font-weight:bold;line-height:1}

#log{position:absolute;left:16px;bottom:150px;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:min(360px,calc(100% - 32px))}
#log div{background:rgba(13,11,10,.82);padding:4px 8px;border-radius:3px;font-size:12px;animation:fade 7s forwards}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}

#dead{position:absolute;inset:0;background:rgba(40,6,4,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:15;text-align:center;padding:16px}
#dead h2{font-family:var(--font-display);font-size:34px;margin:0;color:var(--blood)}
#auto.on{border-color:var(--jade);color:var(--jade)}
</style>

<div id="app">
  <canvas id="c"></canvas>
  <div id="fx"></div>
  <div id="playerLabel">Alaz Oflaz <b>(Sv 1)</b></div>
  <div id="mobLabels"></div>

  <!-- GİRİŞ VE SLOT SEÇİM EKRANI -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>METİN AVCISI 3D</h2>
      <input type="text" id="usernameInput" maxlength="16" placeholder="Kullanıcı Adı" value="AlazOflaz">
      <input type="password" id="passwordInput" maxlength="16" placeholder="Şifre" value="123456">
      
      <div style="margin-top:12px;font-size:12px;color:var(--gold);text-align:left">Karakter Slotu ve Doktrin Seçin:</div>
      <div class="char-select-grid" id="charSelectGrid"></div>

      <button id="startGameBtn" type="button" style="width:100%;padding:12px;font-family:var(--font-display);font-size:16px;font-weight:700">Oyuna Başla / Devam Et</button>
    </div>
  </div>

  <div id="top">
    <b id="tName">Alaz Oflaz</b>
    <span id="tClass" style="color:var(--gold)">Bedensel Savaşçı</span>
    <b id="tLv">Sv 1</b>
    <span id="tZone">Başlangıç Vadisi</span>
    <span>Yang: <b class="gold" id="tGold" style="font-size:14px">0</b></span>
  </div>

  <div id="target" hidden>
    <div class="nm" id="tgName"></div>
    <div class="bar tg"><i id="tgBar"></i><em id="tgTxt"></em></div>
  </div>

  <div id="menuBtns">
    <button id="switchCharBtn" type="button">Karakter Değiştir</button>
    <button id="menuBtn" type="button">Çanta & Statü (I)</button>
  </div>

  <div id="log"></div>

  <div id="hud">
    <div id="bars">
      <div class="bar hp"><i id="hpBar"></i><em id="hpTxt"></em></div>
      <div class="bar mp"><i id="mpBar"></i><em id="mpTxt"></em></div>
      <div class="bar xp"><i id="xpBar"></i></div>
    </div>
    <div id="skills">
      <button class="sk pot" id="pHp" type="button"><kbd>Z</kbd>Can<small id="nHp">0</small></button>
      <button class="sk pot" id="pMp" type="button"><kbd>X</kbd>Mana<small id="nMp">0</small></button>
      <button class="sk pot" id="auto" type="button"><kbd>F</kbd>Oto Av<small id="autoTxt">kapalı</small></button>
    </div>
  </div>

  <aside id="panel" hidden>
    <div id="tabs">
      <button type="button" data-tab="inv" class="on">Ekipman</button>
      <button type="button" data-tab="stats">Statü</button>
      <button type="button" data-tab="skills">Beceriler</button>
      <button type="button" data-tab="up">Yükselt</button>
      <button type="button" data-tab="shop">Dükkan</button>
    </div>
    <div id="pbody"></div>
    <button id="pclose" type="button">Kapat</button>
  </aside>

  <div id="dead" hidden>
    <h2>Öldün</h2>
    <div>Köyde yeniden doğarsın, tecrübenin %10'unu kaybedersin.</div>
    <button id="revive" type="button">Yeniden Doğ</button>
  </div>
</div>

function hAt(gx,gy){
  var r=Math.sqrt(gx*gx+gy*gy),f=Math.min(1,Math.max(0,(r-150)/200));f=f*f*(3-2*f);
  var h=Math.sin(gx*0.0021)*Math.cos(gy*0.0027)+0.5*Math.sin(gx*0.0063+1)*Math.sin(gy*0.0057)+0.25*Math.sin(gx*0.015)*Math.cos(gy*0.013);
  return h*1.5*f;
}
var ZC=['#4f7d3b','#3f6a35','#82893f','#8c7b66','#93503a'].map(function(c){return new THREE.Color(c)});
var VIL=new THREE.Color('#9a8a70');
function groundColor(gx,gy,out){
  var r=Math.sqrt(gx*gx+gy*gy),B=[800,1600,2400,3200],zi=0;
  while(zi<4&&r>=B[zi])zi++;
  out.copy(ZC[zi]);
  var bl=120;
  if(zi>0&&r-B[zi-1]<bl){var f=(r-B[zi-1])/bl;f=f*f*(3-2*f);out.copy(ZC[zi-1]).lerp(ZC[zi],0.5+0.5*f)}
  else if(zi<4&&B[zi]-r<bl){var f2=(B[zi]-r)/bl;f2=f2*f2*(3-2*f2);out.copy(ZC[zi+1]).lerp(ZC[zi],0.5+0.5*f2)}
  var n=Math.sin(gx*0.02)*Math.sin(gy*0.017)*0.5+Math.sin(gx*0.07+gy*0.05)*0.5;
  out.multiplyScalar(1+n*0.08);
  if(r<220){var v=1-Math.min(1,Math.max(0,(r-140)/80));out.lerp(VIL,v)}
  if(r>WORLD_R)out.multiplyScalar(Math.max(0.3,1-(r-WORLD_R)/300));
  return zi;
}
(function buildTerrain(){

var glowTex=(function(){

var PN=1500,pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*3),pVel=new Float32Array(PN*3),pLife=new Float32Array(PN),pMax=new Float32Array(PN),pGrav=new Float32Array(PN),pBase=new Float32Array(PN*3),pNext=0;
for(var pi=0;pi<PN;pi++){pPos[pi*3+1]=-999;pLife[pi]=0}
var pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
var pMat=new THREE.PointsMaterial({size:0.55,map:glowTex,vertexColors:true,transparent:true,blending:ADD,depthWrite:false,sizeAttenuation:true});

function emit(x,y,z,vx,vy,vz,hex,life,grav){
  var i=pNext;pNext=(pNext+1)%PN;
  pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;pVel[i*3]=vx;pVel[i*3+1]=vy;pVel[i*3+2]=vz;
  _pc.set(hex);pBase[i*3]=_pc.r;pBase[i*3+1]=_pc.g;pBase[i*3+2]=_pc.b;
  pLife[i]=life;pMax[i]=life;pGrav[i]=grav||0;
}
function updateParticles(dt){
  for(var i=0;i<PN;i++){
    if(pLife[i]<=0)continue;
    pLife[i]-=dt;
    if(pLife[i]<=0){pPos[i*3+1]=-999;pCol[i*3]=pCol[i*3+1]=pCol[i*3+2]=0;continue}
    pVel[i*3+1]-=pGrav[i]*dt;
    pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;
    var k=pLife[i]/pMax[i];
    pCol[i*3]=pBase[i*3]*k;pCol[i*3+1]=pBase[i*3+1]*k;pCol[i*3+2]=pBase[i*3+2]*k;
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
}

    emit(x,y,z,Math.cos(a)*sp*u,v,Math.sin(a)*sp*u,hex,life||R(0.4,0.8),grav===undefined?9:grav);
  }
}

/* ---------- Savaş Mekaniği ---------- */
function gainXp(n){
  S.xp+=n;
  while(S.xp>=need(S.lv) && S.lv < MAX_LV){
    S.xp-=need(S.lv);S.lv++;S.sp++;S.statPts+=3;
    S.hp=maxHp();S.mp=maxMp();
    addLog('SEVİYE ATLADIN! Sv '+S.lv+' (+1 Beceri, +3 Statü Puanı)');
    addFloat(S.x,S.y,'SEVİYE '+S.lv,'#ffd36b',true,3.4);
    var px=S.x*SC,pz=S.y*SC,py=hAt(S.x,S.y);
    fxPillar(px,py,pz,0xffd36b,9,1.1,1.2);fxRing(px,py,pz,0xffd36b,0.5,6,0.9);
    if(panelOpen)renderPanel();
  }
}
function enemyPos(e){return [e.x*SC,hAt(e.x,e.y),e.y*SC]}
function killMonster(m){
  m.dead=true;m.st='dead';m.respawn=T+4;m.deadT=0;
  S.kills++;gainXp(m.t.xp);
  var p=enemyPos(m);sparks(p[0],p[1]+0.8,p[2],0xffc070,18,4,2,0.7,8);
  dropAt(m.x,m.y,{kind:'gold',amt:RI(m.t.gold[0],m.t.gold[1])});
  if(Math.random()<0.15){dropAt(m.x,m.y,{kind:'item',item:makeRandomItem(m.t.tier)});}
  if(Math.random()<0.08)dropAt(m.x,m.y,{kind:Math.random()<0.7?'hp':'mp'});
  setBar(m.bar,0,false);
  if(target&&target.ref===m)target=null;
}
function hitMonster(m,dmg,crit,hex){
  if(m.dead)return;
  m.hp-=dmg;m.flash=0.12;
  if(m.st!=='chase'&&m.st!=='flee')m.st='chase';
  addFloat(m.x,m.y,String(dmg),crit?'#ffd36b':'#ffffff',crit,m.mo.h+0.3);
  var p=enemyPos(m);sparks(p[0],p[1]+m.mo.h*0.55,p[2],hex||(crit?0xffd36b:0xffffff),crit?14:7,crit?5:3,1.5,0.5,9);
  if(crit)shakeCam(0.12);
  if(m.hp<=0){m.hp=0;killMonster(m)}
}
function hitMetin(mt,dmg,crit,hex){
  if(!mt.alive)return;
  mt.hp-=dmg;mt.flash=0.12;
  addFloat(mt.x,mt.y,String(dmg),crit?'#ffd36b':'#d6b8ff',crit,5.2);
  var p=enemyPos(mt);sparks(p[0],p[1]+3,p[2],hex||0xd0a0ff,crit?14:8,4,2,0.6,6);
  if(crit)shakeCam(0.12);
  var frac=mt.hp/mt.max;
  while(mt.step<4&&frac<=1-0.2*(mt.step+1)&&mt.hp>0){
    mt.step++;
    var zt=ZTYPES[mt.zi];
    for(var i=0;i<3;i++){var a=R(0,6.283);spawnAt(mt.x+Math.cos(a)*90,mt.y+Math.sin(a)*90,zt[Math.random()<0.5?0:1],true);}
    fxRing(p[0],p[1],p[2],0xc080ff,1,9,0.8);
    addLog('Metin Taşı Muhafız Çağırdı!');
  }
  if(mt.hp<=0){
    mt.hp=0;mt.alive=false;mt.resp=T+90;S.metins++;
    gainXp(METIN_XP[mt.zi]);
    dropAt(mt.x,mt.y,{kind:'gold',amt:RI(METIN_GOLD[mt.zi],METIN_GOLD[mt.zi]*2)});
    dropAt(mt.x,mt.y,{kind:'item',item:makeRandomItem(mt.zi+2)});
    
    if(Math.random()<0.75) dropAt(mt.x,mt.y,{kind:'bless'});
    if(Math.random()<0.35) dropAt(mt.x,mt.y,{kind:'elixir'});
    if(Math.random()<0.20) dropAt(mt.x,mt.y,{kind:'redStone'});

    addLog('METİN TAŞI KINLDI!');
    var col=mt.mo.P.col;
    fxBurst(p[0],p[1]+3,p[2],new THREE.Color(col).getHex(),1,9,0.9);
    fxPillar(p[0],p[1],p[2],new THREE.Color(col).getHex(),14,1.4,1.1);
    shakeCam(0.7);
    mt.mo.g.visible=false;
    if(target&&target.ref===mt)target=null;
  }
}
function dealTo(kind,ref,dmg,crit,hex){if(kind==='m')hitMonster(ref,dmg,crit,hex);else hitMetin(ref,dmg,crit,hex)}
function rollDmg(base,mul){
  var d=base*(mul||1)*R(0.85,1.15),crit=Math.random()<(0.10 + S.dex*0.002);
  if(crit)d*=1.8;
  return {d:Math.max(1,Math.round(d)),crit:crit};
}
function forEnemies(cb){
  for(var i=0;i<monsters.length;i++){var m=monsters[i];if(!m.dead)cb('m',m,m.t.r)}
  for(var j=0;j<metins.length;j++){var mt=metins[j];if(mt.alive)cb('x',mt,34)}
}
function hitArea(cx,cy,radius,mul,hex,fn){
  var n=0;
  forEnemies(function(k,e,rad){
    if(dist(e.x,e.y,cx,cy)<radius+rad){
      var r=rollDmg(pAtk(),mul);dealTo(k==='m'?'m':'x',e,r.d,r.crit,hex);n++;
      if(fn)fn(k,e);
    }
  });
  return n;
}
function faceTo(x,y){face=Math.atan2(x-S.x,y-S.y)}
function dirVec(f){return [Math.sin(f),Math.cos(f)]}
function pPos3(){return [S.x*SC,hAt(S.x,S.y),S.y*SC]}

function playerAttack(){
  if(!target)return;
  var r=rollDmg(pAtk(),1);swing=1;atkCd=0.55;
  faceTo(target.ref.x,target.ref.y);
  dealTo(target.kind==='m'?'m':'x',target.ref,r.d,r.crit);
}
function nearestTarget(maxD){
  var best=null,bd=maxD;
  for(var i=0;i<monsters.length;i++){var m=monsters[i];if(m.dead)continue;var d=dist(m.x,m.y,S.x,S.y);if(d<bd){bd=d;best={kind:'m',ref:m}}}
  for(var j=0;j<metins.length;j++){var mt=metins[j];if(!mt.alive)continue;var d2=dist(mt.x,mt.y,S.x,S.y)-20;if(d2<bd){bd=d2;best={kind:'x',ref:mt}}}
  return best;
}
function validTarget(tg){return tg&&((tg.kind==='m'&&!tg.ref.dead)||(tg.kind==='x'&&tg.ref.alive))}

function useSkill(i){
  if(dead)return;
  var SK = getSK();
  var sk = SK[i];
  if(S.lv<sk.lv){addLog(sk.n+' için Sv '+sk.lv+' gerekli');return}
  if(cds[i]>0)return;
  if(S.mp<sk.mp){addLog('Yeterli Mana yok');return}
  var p=pPos3(),mul=skMul(i),hex=new THREE.Color(sk.col).getHex();

  if(i===0){
    var tg=validTarget(target)?target:nearestTarget(140);
    if(!tg){addLog('Yakında hedef yok');return}
    S.mp-=sk.mp;cds[i]=sk.cd;faceTo(tg.ref.x,tg.ref.y);swing=1;castA=0.5;
    var q=enemyPos(tg.ref),r=rollDmg(pAtk(),mul);
    fxPillar(q[0],q[1],q[2],hex,10,1.0,0.7);
    fxBurst(q[0],q[1]+1,q[2],hex,0.4,3.2,0.45);
    shakeCam(0.35);
    dealTo(tg.kind==='m'?'m':'x',tg.ref,r.d,r.crit,hex);
  }else if(i===1){
    S.mp-=sk.mp;cds[i]=sk.cd;spinA=1;
    fxRing(p[0],p[1],p[2],hex,0.5,5.4,0.45);
    var n=hitArea(S.x,S.y,115,mul,hex);
    if(n)shakeCam(0.3);
  }else if(i===2){
    S.mp-=sk.mp;cds[i]=sk.cd;
    if(validTarget(target))faceTo(target.ref.x,target.ref.y);
    swing=1;
    var dv=dirVec(face);
    projs.push({x:S.x+dv[0]*60,y:S.y+dv[1]*60,dx:dv[0],dy:dv[1],d:0,hit:[],mul:mul,hex:hex});
  }else if(i===3){
    S.mp-=sk.mp;cds[i]=sk.cd;castA=1;
    buff=8;fxRing(p[0],p[1],p[2],hex,0.5,5,0.6);
    addLog(sk.n+': Güçlendirme Aurası Aktif!');
  }else if(i===4){
    var dx,dy;
    if(validTarget(target)){dx=target.ref.x-S.x;dy=target.ref.y-S.y}
    else{var dv2=dirVec(face);dx=dv2[0];dy=dv2[1]}
    var l=Math.sqrt(dx*dx+dy*dy)||1;
    S.mp-=sk.mp;cds[i]=sk.cd;
    charge={t:0,dur:0.28,dx:dx/l,dy:dy/l,hit:[],hex:hex};
    face=Math.atan2(charge.dx,charge.dy);moveTo=null;
    shakeCam(0.2);
  }
}
function usePotion(kind){
  if(dead||potCd>0)return;
  var p=pPos3();
  if(kind==='hp'){
    if(S.hpPot<=0){addLog('Can iksirin kalmadı');return}

    S.hpPot--;S.hp=Math.min(maxHp(),S.hp+Math.round(maxHp()*0.4));addFloat(S.x,S.y,'+CAN','#ff8a7a',false,2.8);
    fxRing(p[0],p[1],p[2],0xff5a4a,0.5,3,0.6);
  }else{
    if(S.mpPot<=0){addLog('Mana iksirin kalmadı');return}
    if(S.mp>=maxMp())return;
    S.mpPot--;S.mp=Math.min(maxMp(),S.mp+Math.round(maxMp()*0.5));addFloat(S.x,S.y,'+MANA','#8ab0ff',false,2.8);
    fxRing(p[0],p[1],p[2],0x5a8aef,0.5,3,0.6);
  }

}

  $('dead').hidden=false;
  for(var i=0;i<monsters.length;i++){if(monsters[i].st==='chase'||monsters[i].st==='flee')monsters[i].st='idle'}
}

/* ---------- Oyun Güncelleme ---------- */
function step(e,tx,ty,speed,dt){
  var dx=tx-e.x,dy=ty-e.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d<1)return 0;
  var mv=Math.min(d,speed*dt);
  e.x+=dx/d*mv;e.y+=dy/d*mv;
  return d-mv;
}
function clampWorld(e){var r=Math.sqrt(e.x*e.x+e.y*e.y);if(r>WORLD_R){e.x*=WORLD_R/r;e.y*=WORLD_R/r}}

function update(dt){
  T+=dt;S.play+=dt;animT+=dt;
  if(buff>0)buff-=dt;
  for(var i=0;i<5;i++)if(cds[i]>0)cds[i]-=dt;
  if(potCd>0)potCd-=dt;
  if(atkCd>0)atkCd-=dt;
  if(swing>0)swing=Math.max(0,swing-dt*3.4);
  if(castA>0)castA=Math.max(0,castA-dt*1.6);
  if(spinA>0)spinA=Math.max(0,spinA-dt*2.8);
  var moved=false;

  // Oto Pot Kontrolü
  if(!dead){
    if(S.autoHpOn && S.autoHpPot > 0 && S.hp < maxHp()*0.65){
      var heal = Math.min(S.autoHpPot, Math.round(maxHp()*0.15));
      S.hp = Math.min(maxHp(), S.hp + heal);
      S.autoHpPot -= heal;
      addFloat(S.x,S.y,'+'+heal+' [Oto HP]','#ff8a7a',false,2.2);
    }
    if(S.autoMpOn && S.autoMpPot > 0 && S.mp < maxMp()*0.5){
      var manaHeal = Math.min(S.autoMpPot, Math.round(maxMp()*0.2));
      S.mp = Math.min(maxMp(), S.mp + manaHeal);
      S.autoMpPot -= manaHeal;
      addFloat(S.x,S.y,'+'+manaHeal+' [Oto MP]','#8ab0ff',false,2.2);
    }
  }

  if(!dead){
    if(charge){
      charge.t+=dt;
      var cs=1000*dt;S.x+=charge.dx*cs;S.y+=charge.dy*cs;clampWorld(S);moved=true;
      forEnemies(function(k,e,rad){
        if(charge.hit.indexOf(e)<0&&dist(e.x,e.y,S.x,S.y)<75+rad){
          charge.hit.push(e);var r=rollDmg(pAtk(),skMul(4));dealTo(k,e,r.d,r.crit,charge.hex||0xffffff);
          if(k==='m')e.stun=1.5;shakeCam(0.25);
        }
      });
      if(charge.t>=charge.dur){charge=null}
    }else{
      var kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
      var ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
      if(kx||ky){
        var fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=-fz,rz=fx;
        var wx=fx*(-ky)+rx*kx,wy=fz*(-ky)+rz*kx,l=Math.sqrt(wx*wx+wy*wy)||1;
        S.x+=wx/l*175*dt;S.y+=wy/l*175*dt;clampWorld(S);
        face=Math.atan2(wx,wy);target=null;moveTo=null;moved=true;
      }else if(validTarget(target)){
        var tr=target.ref,rad=target.kind==='m'?tr.t.r:34,d=dist(S.x,S.y,tr.x,tr.y);
        if(d<=60+rad){
          faceTo(tr.x,tr.y);
          if(atkCd<=0)playerAttack();
          if(autoHunt&&!dead){
            var SK=getSK();
            for(var si=0;si<3;si++){if(S.lv>=SK[si].lv&&cds[si]<=0&&S.mp>=SK[si].mp){useSkill(si);break}}
          }
        }else{faceTo(tr.x,tr.y);step(S,tr.x,tr.y,175,dt);clampWorld(S);moved=true}
      }else if(target){target=null}
      else if(moveTo){
        faceTo(moveTo.x,moveTo.y);
        var rem=step(S,moveTo.x,moveTo.y,175,dt);moved=true;
        if(rem<4)moveTo=null;clampWorld(S);
      }
      if(autoHunt&&!target&&!moveTo&&!kx&&!ky){var nt=nearestTarget(380);if(nt)target=nt;}
    }
    var inSafe=dist(S.x,S.y,0,0)<SAFE_R;
    S.mp=Math.min(maxMp(),S.mp+maxMp()*0.02*dt*(inSafe?4:1));
    if(T-lastHit>5||inSafe)S.hp=Math.min(maxHp(),S.hp+maxHp()*(inSafe?0.1:0.01)*dt);
  }
  pMove+=((moved?1:0)-pMove)*Math.min(1,dt*10);

  var alive=0;
  for(var a2=monsters.length-1;a2>=0;a2--){
    var m=monsters[a2];
    if(m.flash>0)m.flash-=dt;
    if(m.dead){m.deadT+=dt;if(T>m.respawn){removeMonster(m);monsters.splice(a2,1)}continue}
    alive++;m.anim+=dt*6;
    var dp=dist(m.x,m.y,S.x,S.y),t=m.t,ox=m.x,oy=m.y;
    if(m.stun>0){m.stun-=dt;m.mv=0;continue}
    var passive=t.lvl<S.lv-6;
    if(m.st==='idle'){
      if(!dead&&!passive&&dp<t.aggro&&dist(S.x,S.y,0,0)>=SAFE_R)m.st='chase';
      else{
        m.wt-=dt;
        if(m.wt<=0){m.wt=R(2,6);m.wx=m.hx+R(-80,80);m.wy=m.hy+R(-80,80)}
        if(dist(m.x,m.y,m.wx,m.wy)>4){m.face=Math.atan2(m.wx-m.x,m.wy-m.y);step(m,m.wx,m.wy,t.spd*0.4,dt)}
      }
      if(m.hp<m.max)m.hp=Math.min(m.max,m.hp+m.max*0.05*dt);
    }else if(m.st==='flee'){
      m.fleeT-=dt;
      var fx2=m.x-S.x,fy2=m.y-S.y,fl=Math.sqrt(fx2*fx2+fy2*fy2)||1;
      m.face=Math.atan2(fx2,fy2);m.x+=fx2/fl*t.spd*1.1*dt;m.y+=fy2/fl*t.spd*1.1*dt;
      if(m.fleeT<=0)m.st=dead?'idle':'chase';
    }else if(m.st==='chase'){
      if(dead||dist(S.x,S.y,0,0)<SAFE_R||dist(m.x,m.y,m.hx,m.hy)>650){m.st='idle';m.wx=m.hx;m.wy=m.hy;continue}
      if(m.cd>0)m.cd-=dt;
      m.face=Math.atan2(S.x-m.x,S.y-m.y);
      if(dp>t.r+26){step(m,S.x,S.y,t.spd,dt);}
      else if(m.cd<=0){
        m.cd=1.2;
        var dmg=Math.max(1,Math.round(t.atk*R(0.8,1.2)*50/(50+aDef())));
        S.hp-=dmg;lastHit=T;addFloat(S.x,S.y,'-'+dmg,'#ff6a5a',false,2.6);
        m.lunge=0.3;shakeCam(0.1);
        if(S.hp<=0){S.hp=0;die()}
      }
    }
    if(m.lunge>0)m.lunge-=dt;
    var moveD=dist(ox,oy,m.x,m.y)/Math.max(dt,0.001);m.mv+=((moveD>5?1:0)-m.mv)*Math.min(1,dt*8);
  }
  if(alive<TARGET_MONSTERS&&Math.random()<dt*1.5)spawnRandom(true);

  for(var b=0;b<metins.length;b++){
    var mt=metins[b];if(mt.flash>0)mt.flash-=dt;
    if(!mt.alive&&T>mt.resp){mt.alive=true;mt.hp=mt.max;mt.step=0;mt.mo.g.visible=true;}
  }

  for(var c=drops.length-1;c>=0;c--){
    var dr=drops[c];dr.t+=dt;
    if(!dead&&dist(dr.x,dr.y,S.x,S.y)<48){
      if(dr.kind==='gold'){S.gold+=dr.amt;addFloat(dr.x,dr.y,'+'+dr.amt+' yang','#ffd36b',false,1.4)}
      else if(dr.kind==='item')addItem(dr.item);
      else if(dr.kind==='bless'){S.blessPaper++;addLog('Kutsama Kağıdı Düştü!')}
      else if(dr.kind==='elixir'){S.elixir++;addLog('Demirci El Kitabı Düştü!')}
      else if(dr.kind==='redStone'){S.redStone++;addLog('Kırmızı Alev Taşı Düştü!')}
      else if(dr.kind==='hp'){S.hpPot++;addLog('Can iksiri toplandı')}
      else if(dr.kind==='mp'){S.mpPot++;addLog('Mana iksiri toplandı')}
      freeDrop(dr);drops.splice(c,1);
    }else if(dr.t>120){freeDrop(dr);drops.splice(c,1)}
  }
}

function updateMobLabels(){
  for(var i=0;i<monsters.length;i++){
    var m=monsters[i];
    if(m.dead||!m.label)continue;
    _v.set(m.x*SC, hAt(m.x,m.y)+m.mo.h+0.6, m.y*SC).project(camera);
    if(_v.z<=1){
      var sx = (_v.x * 0.5 + 0.5) * W;
      var sy = (-_v.y * 0.5 + 0.5) * H;
      m.label.style.display = 'block';
      m.label.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0) translate(-50%,-100%)';
    }else{m.label.style.display='none'}
  }
  for(var j=0;j<metins.length;j++){
    var mt=metins[j];
    if(!mt.alive||!mt.label)continue;
    _v.set(mt.x*SC, hAt(mt.x,mt.y)+mt.mo.h+0.6, mt.y*SC).project(camera);
    if(_v.z<=1){
      var sx = (_v.x * 0.5 + 0.5) * W;
      var sy = (-_v.y * 0.5 + 0.5) * H;
      mt.label.style.display = 'block';
      mt.label.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0) translate(-50%,-100%)';
    }else{mt.label.style.display='none'}
  }
}

function syncVisuals(dt){
  var p=pPos3();
  faceR+=angDiff(face,faceR)*Math.min(1,dt*16);
  var pm=playerModel;
  pm.g.position.set(p[0],p[1],p[2]);
  pm.g.rotation.y=faceR+spinA*Math.PI*2*(spinA>0?1:0);
  animHuman(pm,animT,pMove,swing,castA);

  _v.set(p[0], p[1] + 2.5, p[2]).project(camera);
  if(_v.z <= 1){
    var sx = (_v.x * 0.5 + 0.5) * W;
    var sy = (-_v.y * 0.5 + 0.5) * H;
    $('playerLabel').style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0) translate(-50%,-100%)';
  }

  sun.position.set(p[0]+28,p[1]+46,p[2]+18);sun.target.position.set(p[0],p[1],p[2]);sun.target.updateMatrixWorld();
  sky.position.set(p[0],0,p[2]);

  for(var i=0;i<monsters.length;i++){
    var m=monsters[i],g=m.mo.g,h=hAt(m.x,m.y);
    g.position.set(m.x*SC,h,m.y*SC);
    g.rotation.y=m.face;
    if(m.dead){
      var k=Math.min(1,m.deadT/0.5);g.rotation.z=k*1.45;g.position.y=h-Math.max(0,m.deadT-2.5)*0.8;
      if(m.flash>0){setFlash(m.mo,true)}else if(m.mo.flashOn){setFlash(m.mo,false)}
      m.mo.flashOn=m.flash>0;continue;
    }
    if(m.mo.kind==='b')animBeast(m.mo,animT+m.anim,m.mv);
    else animHuman(m.mo,animT+m.anim,m.mv,m.lunge>0?m.lunge/0.3:0,0);
    var fl=m.flash>0;if(fl!==!!m.mo.flashOn){setFlash(m.mo,fl);m.mo.flashOn=fl}
    var showBar=(m.hp<m.max)||(target&&target.ref===m);
    if(showBar)setBar(m.bar,m.hp/m.max,true);else setBar(m.bar,0,false);
  }

  for(var j=0;j<metins.length;j++){
    var mt=metins[j];if(!mt.alive)continue;
    var P=mt.mo.P;
    P.crystal.rotation.y=animT*0.8+j;
    var fl2=mt.flash>0;if(fl2!==!!mt.mo.flashOn){setFlash(mt.mo,fl2);mt.mo.flashOn=fl2}
    var sb=mt.hp<mt.max||(target&&target.ref===mt);
    if(sb)setBar(mt.bar,mt.hp/mt.max,true);else setBar(mt.bar,0,false);
  }

  for(var d=0;d<drops.length;d++){
    var dr=drops[d],o=dr.obj;
    o.position.y=hAt(dr.x,dr.y)+0.7+Math.sin(dr.t*3)*0.12;
    if(dr.spin)dr.spin.rotation.y=dr.t*2.5;
  }

  if(validTarget(target)){
    var tr=target.ref,tp=enemyPos(tr),rr=target.kind==='m'?tr.t.r*SC*1.6*tr.t.sc*0.8+0.4:2.2;
    selRing.visible=true;selRing.position.set(tp[0],tp[1]+0.12,tp[2]);selRing.scale.set(rr,rr,rr);
  }else selRing.visible=false;

  updateMobLabels();
}

function updateCamera(dt){
  if(keys.q)camYaw-=dt*1.8;if(keys.e)camYaw+=dt*1.8;
  var p=pPos3(),cp=Math.cos(camPitch),sp=Math.sin(camPitch);
  var cx=p[0]+Math.sin(camYaw)*cp*camDist,cz=p[2]+Math.cos(camYaw)*cp*camDist,cy=p[1]+1.6+sp*camDist;
  var gh=hAt(cx/SC,cz/SC)+0.8;if(cy<gh)cy=gh;
  if(shake>0){cx+=R(-1,1)*shake;cy+=R(-1,1)*shake;cz+=R(-1,1)*shake;shake=Math.max(0,shake-dt*1.8)}
  camera.position.set(cx,cy,cz);camera.lookAt(p[0],p[1]+1.5,p[2]);
}

function upCost(it){return Math.round(40*(it.tier||1)*Math.pow((it.plus||0)+1,1.5))}
function upBox(slot,label){
  var it=S[slot];
  if(!it)return '<div class="slot"><div class="lbl">'+label+'</div><div class="nm" style="color:var(--mute)">Boş</div></div>';
  if(it.plus>=9)return slotBox(label,it,slot)+'<div class="note">En üst seviyede (+9).</div>';
  var cost=upCost(it),rate=Math.round(RATES[it.plus]*100);
  return '<div class="slot"><div class="lbl">'+label+'</div><div class="nm" style="color:'+(TCOL[it.tier]||'#fff')+'">'+itemName(it)+' → +'+(it.plus+1)+'</div>'+
    '<div class="st" style="color:var(--mute);margin-bottom:6px">Başarı %'+rate+' · Ücret: '+fmt(cost)+' Yang</div>'+
    '<button type="button" data-act="up" data-s="'+slot+'"'+(S.gold<cost?' disabled':'')+' style="width:100%">Düz Yükselt</button>'+
    '<button type="button" data-act="upBless" data-s="'+slot+'"'+(S.blessPaper<1||S.gold<cost?' disabled':'')+' style="width:100%;margin-top:4px;border-color:var(--gold)">Kutsama Kağıdı ile Bas ('+S.blessPaper+' Adet)</button></div>';
}

  var b=$('pbody'),h='';
  var tabs=document.querySelectorAll('#tabs button');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('on',tabs[i].getAttribute('data-tab')===tab);

  if(tab==='inv'){
    h+='<h3>Kuşanılan Ekipmanlar</h3>';
    h+='<div class="equipment-grid">'+
      slotBox('Silah',S.weapon,'weapon')+
      slotBox('Zırh',S.armor,'armor')+
      slotBox('Kask',S.helm,'helm')+
      slotBox('Kalkan',S.shield,'shield')+
      slotBox('Kolye',S.necklace,'necklace')+
      slotBox('Küpe',S.earring,'earring')+
      slotBox('Bilezik',S.bracelet,'bracelet')+

    '</div>';

    h+='<h3 style="margin-top:14px">Oto İksir Deposu</h3>';
    h+='<div class="note">☀️ Güneş Özütü (Oto HP): <b>'+fmt(S.autoHpPot)+'</b> Kalan Can<br>🌙 Ay Özütü (Oto MP): <b>'+fmt(S.autoMpPot)+'</b> Kalan Mana</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:10px">'+
      '<button type="button" data-act="toggleAutoHp" style="flex:1;border-color:'+(S.autoHpOn?'var(--jade)':'var(--line)')+'">Oto HP: '+(S.autoHpOn?'AÇIK':'KAPALI')+'</button>'+
      '<button type="button" data-act="toggleAutoMp" style="flex:1;border-color:'+(S.autoMpOn?'var(--jade)':'var(--line)')+'">Oto MP: '+(S.autoMpOn?'AÇIK':'KAPALI')+'</button>'+

    h+='<h3 style="margin-top:14px">Çanta ('+S.inv.length+'/'+INV_MAX+')</h3>';

    for(var j=0;j<S.inv.length;j++)h+=itemRow(S.inv[j],j);

  }else if(tab==='stats'){
    h+='<h3>Karakter Statü Dağılımı</h3>'+
    '<div class="note">Dağıtılabilir Statü Puanı: <b style="color:var(--gold);font-size:16px">'+S.statPts+'</b></div>'+
    '<table class="stats">'+
      '<tr><td>VIT (Can/HP):</td><td><b>'+S.vit+'</b></td><td><button type="button" class="stat-btn" data-act="addStat" data-st="vit"'+(S.statPts<1?' disabled':'')+'>+</button></td></tr>'+
      '<tr><td>INT (Mana/SP):</td><td><b>'+S.int+'</b></td><td><button type="button" class="stat-btn" data-act="addStat" data-st="int"'+(S.statPts<1?' disabled':'')+'>+</button></td></tr>'+
      '<tr><td>STR (Saldırı Gücü):</td><td><b>'+S.str+'</b></td><td><button type="button" class="stat-btn" data-act="addStat" data-st="str"'+(S.statPts<1?' disabled':'')+'>+</button></td></tr>'+
      '<tr><td>DEX (Savunma/Kritik):</td><td><b>'+S.dex+'</b></td><td><button type="button" class="stat-btn" data-act="addStat" data-st="dex"'+(S.statPts<1?' disabled':'')+'>+</button></td></tr>'+
    '</table>'+
    '<h3 style="margin-top:18px">Özet Değerler</h3>'+
    '<table class="stats">'+
      '<tr><td>Maksimum HP:</td><td>'+maxHp()+'</td></tr>'+
      '<tr><td>Maksimum MP:</td><td>'+maxMp()+'</td></tr>'+
      '<tr><td>Saldırı Değeri:</td><td>'+pAtk()+'</td></tr>'+
      '<tr><td>Savunma Değeri:</td><td>'+aDef()+'</td></tr>'+
    '</table>';

  }else if(tab==='skills'){
    var SK = getSK();
    h+='<h3>'+CLASSES[S.cls||0].name+' Becerileri</h3><div class="note">Beceri Puanı: <b style="color:var(--gold)">'+S.sp+'</b>. Her seviye %12 ekstra güç katar.</div>';
    for(var s=0;s<5;s++){
      var sk=SK[s],locked=S.lv<sk.lv,lv=S.skl[s];
      h+='<div class="skrow"><div class="h"><b style="color:'+(locked?'var(--mute)':sk.col)+'">'+(s+1)+'. '+sk.n+'</b><span class="st" style="color:var(--mute)">'+(locked?'Sv '+sk.lv+' gerekli':'M'+lv+' / '+SK_MAX)+'</span></div>'+
        '<div class="d">'+sk.d+'</div>'+
        '<div class="st" style="color:var(--mute);font-size:12px;margin-bottom:6px">Hasar %'+Math.round(skMul(s)*100)+' · '+sk.mp+' MP · '+sk.cd+' sn</div>'+
        '<button type="button" data-act="skup" data-i="'+s+'"'+((locked||lv>=SK_MAX||S.sp<1)?' disabled':'')+'>Geliştir (+1 Puan)</button></div>';
    }
  }else if(tab==='up'){
    h+='<h3>Demirci Yükseltme</h3><div class="note">Kutsama Kağıdı ile basarsanız başarısızlıkta eşyanız kırılmaz.</div>';
    if(upMsg)h+=upMsg;
    h+=upBox('weapon','Silah')+upBox('armor','Zırh')+upBox('helm','Kask')+upBox('shield','Kalkan')+upBox('necklace','Kolye')+upBox('earring','Küpe')+upBox('bracelet','Bilezik')+upBox('shoes','Ayakkabı');
  }else if(tab==='shop'){
    h+='<h3>Genişletilmiş Market</h3><div class="note">Mevcut Yang: <b style="color:var(--gold)">'+fmt(S.gold)+'</b></div>';
    h+='<div class="row"><span class="nm">Küçük Can İksiri (x5)</span><button type="button" data-act="buy" data-k="hp" data-cost="125" data-n="5">125 Yang</button></div>';
    h+='<div class="row"><span class="nm">Küçük Mana İksiri (x5)</span><button type="button" data-act="buy" data-k="mp" data-cost="125" data-n="5">125 Yang</button></div>';
    h+='<div class="row"><span class="nm">☀️ Güneş Özütü (Oto 10,000 HP)</span><button type="button" data-act="buyAutoHp" data-cost="2500">2,500 Yang</button></div>';
    h+='<div class="row"><span class="nm">🌙 Ay Özütü (Oto 10,000 MP)</span><button type="button" data-act="buyAutoMp" data-cost="2500">2,500 Yang</button></div>';
    h+='<div class="row"><span class="nm">📜 Kutsama Kağıdı</span><button type="button" data-act="buyBless" data-cost="1000">1,000 Yang</button></div>';
    h+='<div class="row"><span class="nm">👑 Beceri Sıfırlama Parşömeni</span><button type="button" data-act="resetSkills" data-cost="5000">5,000 Yang</button></div>';
    var tot=0;for(var q=0;q<S.inv.length;q++)tot+=itemValue(S.inv[q]);
    h+='<div class="row" style="margin-top:14px"><span class="nm">Çantadaki Tüm Eşyaları Sat</span><button type="button" data-act="sellall"'+(S.inv.length?'':' disabled')+'>'+fmt(tot)+' Yang</button></div>';
  }
  b.innerHTML=h;
}

/* ---------- Olay Dinleyicileri ---------- */
$('startGameBtn').addEventListener('click',function(){
  var userVal = $('usernameInput').value.trim() || 'AlazOflaz';
  var passVal = $('passwordInput').value.trim() || '123456';
  
  currentAccountUser = userVal;
  currentAccountPass = passVal;
  currentSaveKey = getSaveKeyForSlot(userVal, passVal, selectedSlotIdx);

  S = loadSlotData(selectedSlotIdx);
  S.name = userVal;
  
  $('loginScreen').hidden = true;
  buildSkillButtons();
  rebuildPlayer();
  initWorld();
  save();
  addLog('Giriş yapıldı: ' + CLASSES[S.cls].name + ' (Sv ' + S.lv + ')');
});

$('switchCharBtn').addEventListener('click',function(){
  save();
  renderCharSelectGrid();
  $('loginScreen').hidden = false;
});

$('tabs').addEventListener('click',function(e){var t=e.target.getAttribute&&e.target.getAttribute('data-tab');if(t){tab=t;renderPanel()}});
$('pbody').addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('button[data-act]'):null;if(!el)return;
  var act=el.getAttribute('data-act'),i=parseInt(el.getAttribute('data-i'),10);

  if(act==='addStat'){
    var st = el.getAttribute('data-st');
    if(S.statPts > 0){
      S.statPts--; S[st]++;
      S.hp = maxHp(); S.mp = maxMp();
    }
  }else if(act==='toggleAutoHp'){ S.autoHpOn = !S.autoHpOn; }
  else if(act==='toggleAutoMp'){ S.autoMpOn = !S.autoMpOn; }
  else if(act==='buyAutoHp'){
    var cost=parseInt(el.getAttribute('data-cost'),10);
    if(S.gold>=cost){S.gold-=cost; S.autoHpPot+=10000; addLog('Güneş Özütü Alındı (+10,000 HP)')}
  }else if(act==='buyAutoMp'){
    var cost=parseInt(el.getAttribute('data-cost'),10);
    if(S.gold>=cost){S.gold-=cost; S.autoMpPot+=10000; addLog('Ay Özütü Alındı (+10,000 MP)')}
  }else if(act==='buyBless'){
    var cost=parseInt(el.getAttribute('data-cost'),10);
    if(S.gold>=cost){S.gold-=cost; S.blessPaper++; addLog('Kutsama Kağıdı Alındı')}
  }else if(act==='resetSkills'){
    var cost=parseInt(el.getAttribute('data-cost'),10);
    if(S.gold>=cost){
      S.gold-=cost;
      var totSp = 0;
      for(var k=0;k<5;k++){totSp += (S.skl[k]-1); S.skl[k]=1;}
      S.sp += totSp;
      addLog('Beceriler sıfırlandı! Puanlar iade edildi.');
    }
  }else if(act==='equip'){
    var it=S.inv[i];if(!it)return;
    var slotKey = it.type==='w' ? 'weapon' : (it.type==='a' ? 'armor' : it.type);
    var old = S[slotKey];
    S[slotKey] = it;
    S.inv.splice(i,1);
    if(old)S.inv.push(old);
    rebuildPlayer();
  }else if(act==='unequip'){
    var slotKey2 = el.getAttribute('data-slot');
    if(S[slotKey2]){
      if(S.inv.length < INV_MAX){
        S.inv.push(S[slotKey2]);
        S[slotKey2] = null;
        rebuildPlayer();
      }else{addLog('Çantanda yer yok!')}
    }
  }else if(act==='sell'){
    var it2=S.inv[i];if(!it2)return;S.gold+=itemValue(it2);S.inv.splice(i,1);
  }else if(act==='sellall'){
    for(var q=0;q<S.inv.length;q++)S.gold+=itemValue(S.inv[q]);S.inv=[];
  }else if(act==='buy'){
    var n=parseInt(el.getAttribute('data-n'),10),k=el.getAttribute('data-k'),cost=parseInt(el.getAttribute('data-cost'),10);
    if(S.gold<cost){addLog('Yeterli Yang yok');return}
    S.gold-=cost;if(k==='hp')S.hpPot+=n;else S.mpPot+=n;
  }else if(act==='skup'){
    var SK = getSK();
    if(S.sp<1||S.skl[i]>=SK_MAX||S.lv<SK[i].lv)return;
    S.sp--;S.skl[i]++;addLog(SK[i].n+' geliştirildi: M'+S.skl[i]);
  }else if(act==='up'||act==='upBless'){
    var s=el.getAttribute('data-s'),item=S[s];if(!item||item.plus>=9)return;
    var c=upCost(item);if(S.gold<c)return;
    var isBless = act==='upBless';
    if(isBless && S.blessPaper<1)return;

    S.gold-=c;
    if(isBless) S.blessPaper--;

    if(Math.random()<RATES[item.plus]){
      item.plus++;
      upMsg='<div class="msg good">Yükseltme Başarılı! '+itemName(item)+'</div>';
    }else if(isBless){
      upMsg='<div class="msg bad">Başarısız! Kutsama kağıdı sayesinde eşyaya bir şey olmadı.</div>';
    }else if(item.plus>=5){
      item.plus--;
      upMsg='<div class="msg bad">Başarısız! Eşya seviyesi +'+item.plus+'\'e düştü.</div>';
    }else{
      upMsg='<div class="msg bad">Başarısız! Eşya aynı seviyede kaldı.</div>';
    }
    rebuildPlayer();
  }
  renderPanel();
});

$('menuBtn').addEventListener('click',function(){togglePanel()});
$('pclose').addEventListener('click',function(){togglePanel(false)});
$('pHp').addEventListener('click',function(){usePotion('hp')});
$('pMp').addEventListener('click',function(){usePotion('mp')});

$('auto').addEventListener('click',toggleAuto);

window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(e.target&&e.target.tagName==='INPUT')return;
  if(k>='1'&&k<='5')useSkill(parseInt(k,10)-1);
  else if(k==='z')usePotion('hp');else if(k==='x')usePotion('mp');
  else if(k==='f')toggleAuto();
  else if(k==='i')togglePanel();
  else if(k==='escape'){$('loginScreen').hidden = !$('loginScreen').hidden; togglePanel(false);}
  else if(k==='q'||k==='e'){keys[k]=true}
  else if('wasd'.indexOf(k)>=0&&k.length===1||k.indexOf('arrow')===0){keys[k]=true;if(k.indexOf('arrow')===0)e.preventDefault()}
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});

/* ---------- Kontroller & Kamera ---------- */
var ptrs={},dragMoved=0,pinch0=0,startCam=0;
function projScreen(x,y,z){_v.set(x,y,z).project(camera);return {x:(_v.x*0.5+0.5)*W,y:(-_v.y*0.5+0.5)*H,z:_v.z}}
function pickAt(sx,sy){
  var best=null,bd=1e9,fovK=(H/2)/Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  function test(kind,ref,hgt,rad){
    var e=enemyPos(ref),p=projScreen(e[0],e[1]+hgt*0.5,e[2]);
    if(p.z>1)return;
    var dd=camera.position.distanceTo(new THREE.Vector3(e[0],e[1]+hgt*0.5,e[2]));
    var rpx=Math.max(24,rad*fovK/dd),d=Math.hypot(sx-p.x,sy-p.y);
    if(d<rpx&&d<bd){bd=d;best={kind:kind,ref:ref}}
  }
  for(var i=0;i<monsters.length;i++){var m=monsters[i];if(!m.dead)test('m',m,m.mo.h,Math.max(0.9,m.mo.h*0.5))}
  for(var j=0;j<metins.length;j++){var mt=metins[j];if(mt.alive)test('x',mt,5,2.6)}
  return best;
}
function groundAt(sx,sy){
  var ndc=new THREE.Vector2(sx/W*2-1,-(sy/H)*2+1),rc=new THREE.Raycaster();
  rc.setFromCamera(ndc,camera);
  var o=rc.ray.origin,d=rc.ray.direction;
  if(d.y>=-0.01)return null;
  var py=hAt(S.x,S.y),t=(py-o.y)/d.y;
  return [(o.x+d.x*t)/SC,(o.z+d.z*t)/SC];
}
function handleClick(sx,sy){
  if(dead||!$('loginScreen').hidden)return;
  var best=pickAt(sx,sy);
  if(best){target=best;moveTo=null}
  else{
    var g=groundAt(sx,sy);if(!g)return;
    target=null;moveTo={x:g[0],y:g[1]};
    var r=Math.sqrt(g[0]*g[0]+g[1]*g[1]);if(r>WORLD_R){moveTo.x*=WORLD_R/r;moveTo.y*=WORLD_R/r}
  }
}
cv.addEventListener('contextmenu',function(e){e.preventDefault()});
cv.addEventListener('pointerdown',function(e){
  if(!$('loginScreen').hidden)return;
  var rc=cv.getBoundingClientRect();
  ptrs[e.pointerId]={x:e.clientX-rc.left,y:e.clientY-rc.top,sx:e.clientX-rc.left,sy:e.clientY-rc.top};
  var ids=Object.keys(ptrs);
  if(ids.length===1){dragMoved=0}
  if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch0=Math.hypot(a.x-b.x,a.y-b.y);startCam=camDist;dragMoved=99}
});
cv.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId];if(!p)return;
  var rc=cv.getBoundingClientRect(),nx=e.clientX-rc.left,ny=e.clientY-rc.top,dx=nx-p.x,dy=ny-p.y;
  p.x=nx;p.y=ny;
  var ids=Object.keys(ptrs);
  if(ids.length===1){
    dragMoved+=Math.abs(dx)+Math.abs(dy);
    if(dragMoved>10){camYaw-=dx*0.006;camPitch=Math.max(0.28,Math.min(1.25,camPitch+dy*0.004))}
  }else if(ids.length===2&&pinch0>0){
    var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
    camDist=Math.max(7,Math.min(26,startCam*pinch0/Math.max(20,d)));
  }
});
function endPtr(e,click){
  var p=ptrs[e.pointerId];if(!p)return;
  var wasSingle=Object.keys(ptrs).length===1;
  delete ptrs[e.pointerId];
  if(click&&wasSingle&&dragMoved<=10)handleClick(p.sx,p.sy);
}
cv.addEventListener('pointerup',function(e){endPtr(e,true)});
cv.addEventListener('pointercancel',function(e){endPtr(e,false)});
cv.addEventListener('wheel',function(e){e.preventDefault();camDist=Math.max(7,Math.min(26,camDist+e.deltaY*0.01))},{passive:false});

/* ---------- Ana Döngü ---------- */
var prev=0,saveT=0;
function frame(ts){
  var dt=Math.min(0.05,(ts-prev)/1000||0.016);prev=ts;
  if($('loginScreen').hidden){
    update(dt);syncVisuals(dt);updateFx(dt);updateParticles(dt);updateCamera(dt);updateFloats(dt);
    renderer.render(scene,camera);updateHud();
    saveT+=dt;if(saveT>5){saveT=0;save()}
  }
  requestAnimationFrame(frame);
}
window.addEventListener('visibilitychange',function(){if(document.hidden)save()});
window.addEventListener('pagehide',save);

S=newState('AlazOflaz',0);
resize();
renderCharSelectGrid();
buildSkillButtons();
initWorld();
rebuildPlayer();
requestAnimationFrame(frame);
})();
