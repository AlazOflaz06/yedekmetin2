<style>
:root{
  --bg:#0b0908;
  --panel:#171310;
  --panel2:#221b16;
  --line:#3a2e25;
  --gold:#d9a441;
  --blood:#c0392f;
  --jade:#3f9a82;
  --mana:#4a78c9;
  --text:#eadfce;
  --mute:#a09280;
  --font-display:'Philosopher',Georgia,'Times New Roman',serif;
  --font-body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--bg);touch-action:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg{position:absolute;left:0;top:0;font-weight:600;font-size:15px;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;will-change:transform,opacity}
.dmg.big{font-size:22px;font-weight:700}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
h3{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0 0 8px;color:var(--gold);letter-spacing:.02em}

.mobLabel{
  position:absolute;
  font-family:var(--font-display);
  font-weight:700;
  font-size:11px;
  color:#fff;
  text-shadow:0 1px 3px #000, 0 0 5px #000;
  pointer-events:none;
  transform:translate(-50%,-100%);
  white-space:nowrap;
  z-index:4;
  background:rgba(13,11,10,0.75);
  padding:1px 6px;
  border-radius:3px;
  border:1px solid rgba(217,164,65,0.4);
  display:none;
}
.mobLabel b{color:var(--gold)}
.mobLabel.metin{border-color:#b88cf5;color:#e8d8ff}

#playerLabel{
  position:absolute;
  font-family:var(--font-display);
  font-weight:700;
  font-size:13px;
  color:#fff;
  text-shadow:0 1px 3px #000, 0 0 6px #000;
  pointer-events:none;
  transform:translate(-50%,-100%);
  white-space:nowrap;
  z-index:5;
  background:rgba(13,11,10,0.85);
  padding:2px 8px;
  border-radius:4px;
  border:1px solid rgba(217,164,65,0.7);
}
#playerLabel b{color:var(--gold)}

#loginScreen{position:absolute;inset:0;background:rgba(13,11,10,0.96);display:flex;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(8px)}
.login-box{background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:24px;width:min(540px,94vw);box-shadow:0 10px 35px rgba(0,0,0,0.9);text-align:center}
.login-box h2{font-family:var(--font-display);color:var(--gold);font-size:28px;margin:0 0 14px;letter-spacing:1px}
.login-box input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--gold);font-family:var(--font-display);font-size:15px;text-align:center;box-sizing:border-box;margin-bottom:10px;outline:none}

.char-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 20px;max-height:280px;overflow-y:auto;padding-right:4px}
.char-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:12px}
.char-card:hover,.char-card.on{border-color:var(--gold);background:#2c221b;box-shadow:0 0 12px rgba(217,164,65,0.35)}
.char-avatar{width:48px;height:48px;border-radius:50%;background:#110e0c;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:inset 0 0 8px rgba(0,0,0,0.8)}
.char-info b{display:block;font-family:var(--font-display);color:var(--gold);font-size:14px}
.char-info span{display:block;font-size:11px;color:var(--mute)}

#top{position:absolute;top:12px;left:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:rgba(27,22,19,.85);border:1px solid var(--line);padding:8px 12px;border-radius:4px;max-width:calc(100% - 140px)}
#top b{font-family:var(--font-display);font-size:17px;color:var(--gold)}
#top span{color:var(--mute)}
#top .gold{color:var(--gold);font-variant-numeric:tabular-nums}

#target{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:min(320px,50vw);background:rgba(27,22,19,.9);border:1px solid var(--line);padding:8px 12px;border-radius:4px;text-align:center;display:flex;align-items:center;justify-content:space-between;gap:8px}
#target .tg-content{flex:1}
#target .nm{font-family:var(--font-display);font-size:14px;margin-bottom:4px}
#infoBtn{background:var(--gold);color:#000;font-weight:700;border-radius:50%;width:26px;height:26px;padding:0;line-height:26px;border:none;flex-shrink:0;box-shadow:0 0 8px rgba(217,164,65,0.6)}

#mobInfoModal{position:absolute;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:25;backdrop-filter:blur(4px)}
.mob-info-card{background:var(--panel);border:2px solid var(--gold);border-radius:8px;padding:20px;width:min(380px,90vw);box-shadow:0 10px 30px rgba(0,0,0,0.9)}
.mob-info-card h3{margin-top:0;font-size:18px;border-bottom:1px solid var(--line);padding-bottom:8px}
.mob-info-card .row-info{margin:8px 0;font-size:13px}
.mob-info-card .row-info b{color:var(--gold)}

.bar{height:12px;background:#0a0807;border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .12s}
.bar em{position:absolute;inset:0;font-style:normal;font-size:10px;line-height:11px;text-align:center;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 1px #000}
.hp i{background:linear-gradient(#d9473b,#9c241b)}
.mp i{background:linear-gradient(#5a89de,#35599b)}
.xp i{background:linear-gradient(#e0b24a,#a87a1e)}
.tg i{background:linear-gradient(#d9473b,#9c241b)}

#hud{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:min(820px,calc(100% - 24px));display:flex;flex-direction:column;gap:6px;background:rgba(27,22,19,.92);border:1px solid var(--line);padding:10px;border-radius:4px}
#bars{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#bars .xp{grid-column:1/-1;height:8px}
#skills{display:flex;gap:4px;flex-wrap:wrap}
.sk{position:relative;flex:1 1 0;min-width:46px;padding:6px 2px;text-align:center;font-size:11px;overflow:hidden;line-height:1.2}
.sk kbd{display:block;font-family:var(--font-display);font-weight:700;color:var(--gold);font-size:12px}
.sk small{display:block;color:var(--mute);font-size:9px}
.sk .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.7);pointer-events:none}
.sk .lv{position:absolute;top:2px;right:3px;font-size:9px;color:var(--jade)}
.sk.lock{opacity:.4}
.sk.pot{flex:.8 1 0}

#menuBtns{position:absolute;top:12px;right:16px;display:flex;gap:8px}
#panel{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:10}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:12px 2px;font-family:var(--font-display);font-weight:700;font-size:11px;color:var(--mute);border-bottom:2px solid transparent}
#tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
#pbody{flex:1;overflow-y:auto;padding:14px;min-height:0}
#pclose{margin:10px 14px 14px;width:calc(100% - 28px)}

.item-icon{width:32px;height:32px;background:#110e0c;border:1px solid var(--gold);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;margin-right:8px;vertical-align:middle;box-shadow:inset 0 0 5px rgba(0,0,0,0.8)}

.equipment-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row .nm{flex:1 1 120px;min-width:0;font-weight:500;display:flex;align-items:center}
.row .st{color:var(--mute);font-size:12px}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:4px}
.slot .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.slot .nm{font-family:var(--font-display);font-size:14px;margin:2px 0;display:flex;align-items:center}
.slot .efs{font-size:10px;color:var(--jade);margin-top:2px}
.slot .socket{font-size:10px;color:#8ff3ff;margin-top:2px}
.msg{margin:10px 0;padding:8px 10px;border-radius:4px;background:var(--panel2);border-left:3px solid var(--gold);font-size:13px}
.skrow{padding:10px 0;border-bottom:1px solid var(--line)}
.skrow .h b{font-family:var(--font-display);font-size:15px}
.skrow .d{color:var(--mute);font-size:12px;margin:3px 0 6px}
table.stats{width:100%;border-collapse:collapse}
table.stats td{padding:6px 0;border-bottom:1px solid var(--line)}
table.stats td:last-child{text-align:right}

#log{position:absolute;left:16px;bottom:150px;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:min(360px,calc(100% - 32px))}
#log div{background:rgba(13,11,10,.82);padding:4px 8px;border-radius:3px;font-size:12px;animation:fade 7s forwards}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}

#dead{position:absolute;inset:0;background:rgba(40,6,4,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:15;text-align:center}
#dead h2{font-family:var(--font-display);font-size:34px;margin:0;color:var(--blood)}
</style>

function getSaveKeyForSlot(user,pass,slot){return BASE_SAVE_KEY + user + '_' + pass + '_slot' + slot;}

function loadSlotData(slot){
  var key = getSaveKeyForSlot(currentAccountUser, currentAccountPass, slot);
  var s=null;
  try{var raw=localStorage.getItem(key);if(raw)s=JSON.parse(raw);}catch(e){s=null}
  var base=newState('Alaz Oflaz', slot);
  if(s&&typeof s==='object'){for(var k in base){if(s[k]!==undefined)base[k]=s[k];}}
  if(!Array.isArray(base.inv))base.inv=[];
  if(!Array.isArray(base.skl)||base.skl.length!==6)base.skl=[1,1,1,1,1,1];
  if(base.cls===undefined)base.cls=slot;
  return base;

function mult(p){return 1+0.25*p}
function itemStat(it){
  if(!it)return 0;
  var st = 0;
  if(it.type==='w') st = Math.round(WBASE[it.tier]*mult(it.plus));
  else if(it.type==='a') st = Math.round(ABASE[it.tier]*mult(it.plus));
  else if(it.type==='helm'||it.type==='shield') st = Math.round(it.tier*4*mult(it.plus));
  else st = Math.round(it.tier*3*mult(it.plus));

  /* Cevher Bonusu */
  if(it.socket) st += (it.socket * 10);
  return st;
}

function itemName(it){
  if(!it)return 'Boş';
  var cls = S ? S.cls : 0;
  var wName = CLASSES[cls].wName;
  var name = '';
  if(it.type==='w') name = WEAPONS[it.tier]+' '+wName;
  else if(it.type==='a') name = ARMORS[it.tier];
  else if(it.type==='helm') name = HELMETS[it.tier]||'Kask';
  else if(it.type==='shield') name = SHIELDS[it.tier]||'Kalkan';
  else if(it.type==='necklace') name = (JEWELRY[it.tier]||'')+ ' Kolye';
  else if(it.type==='earring') name = (JEWELRY[it.tier]||'')+ ' Küpe';
  else if(it.type==='bracelet') name = (JEWELRY[it.tier]||'')+ ' Bilezik';
  else if(it.type==='shoes') name = (JEWELRY[it.tier]||'')+ ' Ayakkabı';
  return name + (it.plus?' +'+it.plus:'');
}
function itemValue(it){return (it.tier||1)*(it.tier||1)*25+(it.plus||0)*(it.plus||0)*15}

function totalEfsun(key){
  var tot = 0;
  var slots = ['weapon','armor','helm','shield','necklace','earring','bracelet','shoes'];
  for(var i=0;i<slots.length;i++){
    var it = S[slots[i]];
    if(it && Array.isArray(it.efs)){
      for(var j=0;j<it.efs.length;j++){
        if(it.efs[j].k===key) tot += it.efs[j].v;
      }
    }
  }
  return tot;
}

function stoneBonus(type){
  var b=0;
  if(S.weapon && Array.isArray(S.weapon.stones)){
    for(var i=0;i<S.weapon.stones.length;i++){if(S.weapon.stones[i]===type)b+=25;}
  }
  if(S.armor && Array.isArray(S.armor.stones)){
    for(var j=0;j<S.armor.stones.length;j++){if(S.armor.stones[j]===type)b+=25;}
  }
  return b;
}

function maxHp(){return 100 + (S.vit*15) + (S.lv*10) + itemStat(S.bracelet)*10 + totalEfsun('hp') + (stoneBonus('life')*20);}
function maxMp(){return 50 + (S.int*10) + (S.lv*5) + itemStat(S.necklace)*10;}
function pAtk(){return Math.round((6 + (S.str*2) + (S.dex*0.8) + (S.lv*2) + (S.weapon?itemStat(S.weapon):0) + totalEfsun('atk') + (mounted?50:0)) * (buff>0?1.5:1));}
function aDef(){
  var d = S.armor ? itemStat(S.armor) : 0;
  d += itemStat(S.helm) + itemStat(S.shield) + itemStat(S.necklace) + itemStat(S.earring) + itemStat(S.bracelet) + itemStat(S.shoes);
  return d + Math.round(S.dex*0.5) + Math.round(S.vit*0.3);
}
function need(lv){return Math.round(35*Math.pow(lv,1.6));}
function fmt(n){return Math.round(n).toLocaleString('tr-TR');}
function skMul(i){return getSK()[i].mul*(1+0.12*(S.skl[i]-1));}

var _pc=new THREE.Color();
function emit(x,y,z,vx,vy,vz,hex,life,grav){
  var i=pNext;pNext=(pNext+1)%PN;
  pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;pVel[i*3]=vx;pVel[i*3+1]=vy;pVel[i*3+2]=vz;
  _pc.set(hex);pBase[i*3]=_pc.r;pBase[i*3+1]=_pc.g;pBase[i*3+2]=_pc.b;
  pLife[i]=life;pMax[i]=life;pGrav[i]=grav||0;
}
function updateParticles(dt){
  for(var i=0;i<PN;i++){
    if(pLife[i]<=0)continue;
    pLife[i]-=dt;
    if(pLife[i]<=0){pPos[i*3+1]=-999;pCol[i*3]=pCol[i*3+1]=pCol[i*3+2]=0;continue}
    pVel[i*3+1]-=pGrav[i]*dt;
    pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;
    var k=pLife[i]/pMax[i];
    pCol[i*3]=pBase[i*3]*k;pCol[i*3+1]=pBase[i*3+1]*k;pCol[i*3+2]=pBase[i*3+2]*k;
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
}
function sparks(x,y,z,hex,n,sp,up,life,grav){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283,u=Math.random(),v=(Math.random()-0.2)*sp*0.7+up;
    emit(x,y,z,Math.cos(a)*sp*u,v,Math.sin(a)*sp*u,hex,life||R(0.4,0.8),grav===undefined?9:grav);
  }
}

var fxs=[];
function fxMat(c,op){var m=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:op,blending:ADD,depthWrite:false,side:THREE.DoubleSide});m.userData.fx=true;return m}
function fxAdd(obj,dur,fn){var e={obj:obj,t:0,dur:dur,fn:fn};scene.add(obj);fxs.push(e);return e}
function fxFree(e){scene.remove(e.obj);}
function updateFx(dt){
  for(var i=fxs.length-1;i>=0;i--){
    var e=fxs[i];e.t+=dt;var k=Math.min(1,e.t/e.dur);
    e.fn(k,dt,e);
    if(k>=1){fxFree(e);fxs.splice(i,1)}
  }
}
function fxRing(x,y,z,c,r0,r1,dur){
  var m=new THREE.Mesh(GEO('ring',0.86,1,48),fxMat(c,0.9));m.rotation.x=-Math.PI/2;m.position.set(x,y+0.1,z);
  fxAdd(m,dur,function(k){var r=r0+(r1-r0)*(1-Math.pow(1-k,2));m.scale.set(r,r,r);m.material.opacity=0.9*(1-k)});
}
function fxBurst(x,y,z,c,r0,r1,dur){
  var m=new THREE.Mesh(GEO('sph',1,18,12),fxMat(c,0.7));m.position.set(x,y,z);
  fxAdd(m,dur,function(k){var r=r0+(r1-r0)*(1-Math.pow(1-k,3));m.scale.set(r,r,r);m.material.opacity=0.7*(1-k)});
}
function fxPillar(x,y,z,c,h,r,dur){
  var m=new THREE.Mesh(GEO('cyl',1,1,1,18,1,true),fxMat(c,0.6));m.position.set(x,y+h/2,z);m.scale.set(r,h,r);
  fxAdd(m,dur,function(k){var rr=r*(1-k*0.7);m.scale.set(rr,h,rr);m.material.opacity=0.6*(1-k)});
}
function shakeCam(a){shake=Math.max(shake,a)}

var playerModel=null;
function rebuildPlayer(){

  playerModel=buildPlayerModel();scene.add(playerModel.g);
  if(!mountModel){
    mountModel=buildHorseModel();

var selRing=new THREE.Mesh(GEO('ring',0.8,1,40),new THREE.MeshBasicMaterial({color:0xe5b84d,transparent:true,opacity:0.9,side:THREE.DoubleSide,depthWrite:false}));
selRing.rotation.x=-Math.PI/2;selRing.visible=false;scene.add(selRing);

function createMobLabel(name, lvl, isMetin){
  var el=document.createElement('div');
  el.className = 'mobLabel' + (isMetin?' metin':'');
  el.innerHTML = (isMetin ? '<b>[Metin]</b> ' : '<b>[Sv '+lvl+']</b> ') + name;
  $('mobLabels').appendChild(el);
  return el;
}

function spawnAt(x,y,ti,aggro){
  var t=MT[ti],mo=buildMonsterModel(t);
  var lbl = createMobLabel(t.name, t.lvl, false);
  var m={t:t,x:x,y:y,hx:x,hy:y,hp:t.hp,max:t.hp,st:aggro?'chase':'idle',wx:x,wy:y,wt:R(0,4),cd:R(0,1),flash:0,dead:false,anim:R(0,6),face:R(0,6.28),stun:0,fleeT:0,mo:mo,lunge:0,deadT:0,mv:0,label:lbl};
  m.bar=makeBar(mo.g,(mo.h+0.5)/t.sc,1.3/t.sc);
  mo.g.position.set(x*SC,hAt(x,y),y*SC);scene.add(mo.g);
  monsters.push(m);return m;
}
function removeMonster(m){
  scene.remove(m.mo.g);
  if(m.label&&m.label.parentNode)m.label.parentNode.removeChild(m.label);
  m.bar.bg.material.dispose();m.bar.fg.material.dispose();
}
function spawnRandom(farFromPlayer){
  for(var n=0;n<20;n++){
    var a=R(0,6.283),r=Math.sqrt(Math.random())*1900;
    if(r<SAFE_R+40)continue;
    var x=Math.cos(a)*r,y=Math.sin(a)*r;
    if(farFromPlayer&&dist(x,y,S.x,S.y)<250)continue;
    var zt=ZTYPES[zoneOf(r)];
    spawnAt(x,y,zt[Math.random()<0.5?0:1],false);
    return;
  }
}

function initWorld(){
  for(var i=0;i<monsters.length;i++)removeMonster(monsters[i]);
  for(var j=0;j<metins.length;j++){
    scene.remove(metins[j].mo.g);
    if(metins[j].label&&metins[j].label.parentNode)metins[j].label.parentNode.removeChild(metins[j].label);
  }
  for(var d=0;d<drops.length;d++)scene.remove(drops[d].obj);
  monsters=[];metins=[];drops=[];
  
  for(var a=0;a<TARGET_MONSTERS;a++)spawnRandom(true);
  
  var MP=[[300,0.3],[500,2.4],[700,4.2],[900,1.1],[1100,3.3],[1300,5.5],[1500,0.2],[1700,2.0],[1900,4.4],[400,1.5],[600,3.5],[800,5.2],[1000,2.1],[1200,0.8],[1400,4.1],[1600,1.9]];
  for(var k=0;k<MP.length;k++){
    var r=MP[k][0],an=MP[k][1],zi=zoneOf(r),mo=buildMetinModel(zi);
    var mLbl = createMobLabel('Metin Taşı', (zi*5+5), true);
    var mt={x:Math.cos(an)*r,y:Math.sin(an)*r,zi:zi,max:METIN_HP[zi],hp:METIN_HP[zi],alive:true,resp:0,step:0,flash:0,mo:mo,isMetin:true,label:mLbl};
    mt.bar=makeBar(mo.g,mo.h+0.5,2.2);
    mo.g.position.set(mt.x*SC,hAt(mt.x,mt.y),mt.y*SC);scene.add(mo.g);
    metins.push(mt);
  }
}

function makeRandomItem(tier){
  var types=['w','a','helm','shield','necklace','earring','bracelet','shoes'];
  var selType = types[Math.floor(Math.random()*types.length)];
  return {type:selType,tier:Math.max(1,Math.min(5,tier)),plus:0,efs:[],stones:[],socket:0};
}

function addItem(it){
  if(S.inv.length>=INV_MAX){var v=itemValue(it);S.gold+=v;addLog('Çanta dolu! '+itemName(it)+' satıldı (+'+v+' yang)');return}
  S.inv.push(it);addLog('Eşya Kazanıldı: '+itemName(it));
  if(panelOpen)renderPanel();
}

function dropAt(x,y,d){
  d.x=x+R(-15,15);d.y=y+R(-15,15);d.t=R(0,6);
  var g=new THREE.Group(),beamC=0xffffff;
  if(d.kind==='gold'){
    var coin=new THREE.Mesh(GEO('cyl',0.28,0.28,0.07,14),new THREE.MeshPhongMaterial({color:0xe5b84d,emissive:0x7a5a10,shininess:90}));coin.rotation.x=Math.PI/2;
    var cn=new THREE.Group();cn.add(coin);g.add(cn);d.spin=cn;beamC=0xffd36b;
  }else if(d.kind==='item'){
    var c=TCOL[d.item.tier]||'#fff';
    var bx=new THREE.Mesh(GEO('box',0.5,0.5,0.5),new THREE.MeshPhongMaterial({color:c,emissive:c,emissiveIntensity:0.35,shininess:80}));g.add(bx);d.spin=bx;beamC=new THREE.Color(c).getHex();
  }else if(d.kind==='bless'||d.kind==='efsunObj'||d.kind==='efsunAdd'){
    var matCol = d.kind==='bless'?0xfff0aa:(d.kind==='efsunObj'?0xa0ff88:0xff88a0);
    var matMesh = new THREE.Mesh(GEO('oct',0.35,0),new THREE.MeshPhongMaterial({color:matCol,emissive:matCol,emissiveIntensity:0.5}));g.add(matMesh);d.spin=matMesh;beamC=matCol;
  }else{
    var pc=d.kind==='hp'?0xd9473b:0x4a78c9;
    var fl=new THREE.Mesh(GEO('sph',0.26,12,10),new THREE.MeshPhongMaterial({color:pc,emissive:pc,emissiveIntensity:0.4,shininess:100}));g.add(fl);d.spin=fl;beamC=pc;
  }
  var beam=new THREE.Mesh(GEO('cyl',0.07,0.07,3,8,1,true),fxMat(beamC,0.35));beam.position.y=1.7;g.add(beam);
  d.obj=g;g.position.set(d.x*SC,hAt(d.x,d.y)+0.6,d.y*SC);scene.add(g);
  
  if(autoHunt){
    setTimeout(function(){
      if(d.kind==='gold'){S.gold+=d.amt;addFloat(S.x,S.y,'+'+d.amt+' yang [Oto]','#ffd36b',false,1.4)}
      else if(d.kind==='item')addItem(d.item);
      else if(d.kind==='bless'){S.blessPaper++;addLog('Kutsama Kağıdı Toplandı!')}
      else if(d.kind==='efsunObj'){S.efsunObj++;addLog('Efsun Nesnesi Toplandı!')}
      else if(d.kind==='efsunAdd'){S.efsunAdd++;addLog('Arttırma Kağıdı Toplandı!')}
      else if(d.kind==='hp'){S.hpPot++;addLog('Can iksiri toplandı')}
      else if(d.kind==='mp'){S.mpPot++;addLog('Mana iksiri toplandı')}
      freeDrop(d);
      var idx=drops.indexOf(d);if(idx>=0)drops.splice(idx,1);
    },200);
  }else{
    drops.push(d);
  }
}

function freeDrop(d){scene.remove(d.obj);}

var _v=new THREE.Vector3();
function addFloat(x,y,txt,col,big,h){
  var el=document.createElement('div');el.className='dmg'+(big?' big':'');el.textContent=txt;el.style.color=col;
  $('fx').appendChild(el);
  floats.push({x:x,y:y,h:h===undefined?2.4:h,t:0,el:el,ox:R(-14,14)});
  if(floats.length>60){var o=floats.shift();o.el.remove()}
}
function updateFloats(dt){
  for(var i=floats.length-1;i>=0;i--){
    var f=floats[i];f.t+=dt;
    if(f.t>1.1){f.el.remove();floats.splice(i,1);continue}
    _v.set(f.x*SC,hAt(f.x,f.y)+f.h+f.t*1.4,f.y*SC).project(camera);
    if(_v.z>1){f.el.style.opacity='0';continue}
    var sx=(_v.x*0.5+0.5)*W+f.ox,sy=(-_v.y*0.5+0.5)*H;
    f.el.style.transform='translate3d('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px,0) translate(-50%,-50%)';
    f.el.style.opacity=String(Math.max(0,1-f.t/1.1));
  }
}

function gainXp(n){
  S.xp+=n;
  while(S.xp>=need(S.lv) && S.lv < MAX_LV){
    S.xp-=need(S.lv);S.lv++;S.sp++;S.statPts+=3;
    S.hp=maxHp();S.mp=maxMp();
    addLog('SEVİYE ATLADIN! Sv '+S.lv+' (+1 Beceri, +3 Statü Puanı)');
    addFloat(S.x,S.y,'SEVİYE '+S.lv,'#ffd36b',true,3.4);
    var px=S.x*SC,pz=S.y*SC,py=hAt(S.x,S.y);
    fxPillar(px,py,pz,0xffd36b,9,1.1,1.2);fxRing(px,py,pz,0xffd36b,0.5,6,0.9);
    if(panelOpen)renderPanel();
  }
}
function enemyPos(e){return [e.x*SC,hAt(e.x,e.y),e.y*SC]}

/* ÖLDÜĞÜ AN ETİKET VE BAR DİREKT SİLİNİR */
function killMonster(m){
  m.dead=true;m.st='dead';m.respawn=T+15;
  m.deadT=0;
  if(m.label && m.label.parentNode) m.label.parentNode.removeChild(m.label);
  setBar(m.bar,0,false);

  S.kills++;gainXp(m.t.xp);
  var p=enemyPos(m);sparks(p[0],p[1]+0.8,p[2],0xffc070,18,4,2,0.7,8);
  dropAt(m.x,m.y,{kind:'gold',amt:RI(m.t.gold[0],m.t.gold[1])});
  if(Math.random()<0.20){dropAt(m.x,m.y,{kind:'item',item:makeRandomItem(m.t.tier)});}
  if(Math.random()<0.15)dropAt(m.x,m.y,{kind:'efsunObj'});
  if(target&&target.ref===m)target=null;
}

function hitMonster(m,dmg,crit,hex){
  if(m.dead)return;
  if(m.t.type==='Hayvan') dmg = Math.round(dmg * (1 + totalEfsun('anim')/100));
  if(m.t.type==='Mistik') dmg = Math.round(dmg * (1 + totalEfsun('mist')/100));
  if(m.t.type==='Ork') dmg = Math.round(dmg * (1 + totalEfsun('orc')/100));

  /* Canavar Taşı Bonusu */
  dmg = Math.round(dmg * (1 + stoneBonus('monster')/100));

  m.hp-=dmg;m.flash=0.12;
  if(m.st!=='chase'&&m.st!=='flee')m.st='chase';
  addFloat(m.x,m.y,String(dmg),crit?'#ffd36b':'#ffffff',crit,m.mo.h+0.3);
  var p=enemyPos(m);sparks(p[0],p[1]+m.mo.h*0.55,p[2],hex||(crit?0xffd36b:0xffffff),crit?14:7,crit?5:3,1.5,0.5,9);
  if(crit)shakeCam(0.12);
  if(m.hp<=0){m.hp=0;killMonster(m)}
}

function hitMetin(mt,dmg,crit,hex){
  if(!mt.alive)return;

  /* Metin Taşı Bonusu */
  dmg = Math.round(dmg * (1 + stoneBonus('metin')/100));

  mt.hp-=dmg;mt.flash=0.12;
  addFloat(mt.x,mt.y,String(dmg),crit?'#ffd36b':'#d6b8ff',crit,5.2);
  var p=enemyPos(mt);sparks(p[0],p[1]+3,p[2],hex||0xd0a0ff,crit?14:8,4,2,0.6,6);
  if(crit)shakeCam(0.12);
  var frac=mt.hp/mt.max;
  while(mt.step<4&&frac<=1-0.2*(mt.step+1)&&mt.hp>0){
    mt.step++;
    var zt=ZTYPES[mt.zi];
    for(var i=0;i<3;i++){var a=R(0,6.283);spawnAt(mt.x+Math.cos(a)*70,mt.y+Math.sin(a)*70,zt[Math.random()<0.5?0:1],true);}
    fxRing(p[0],p[1],p[2],0xc080ff,1,9,0.8);
  }
  if(mt.hp<=0){
    mt.hp=0;mt.alive=false;mt.resp=T+15;
    if(mt.label && mt.label.parentNode) mt.label.parentNode.removeChild(mt.label);
    setBar(mt.bar,0,false);

    S.metins++;
    gainXp(METIN_XP[mt.zi]);
    dropAt(mt.x,mt.y,{kind:'gold',amt:RI(METIN_GOLD[mt.zi],METIN_GOLD[mt.zi]*2)});
    dropAt(mt.x,mt.y,{kind:'item',item:makeRandomItem(mt.zi+2)});
    if(Math.random()<0.85) dropAt(mt.x,mt.y,{kind:'bless'});
    if(Math.random()<0.70) dropAt(mt.x,mt.y,{kind:'efsunObj'});
    if(Math.random()<0.70) dropAt(mt.x,mt.y,{kind:'efsunAdd'});

    addLog('METİN TAŞI PATLADI!');
    var col=mt.mo.P.col;
    fxBurst(p[0],p[1]+3,p[2],new THREE.Color(col).getHex(),1,9,0.9);
    fxPillar(p[0],p[1],p[2],new THREE.Color(col).getHex(),14,1.4,1.1);
    shakeCam(0.7);
    mt.mo.g.visible=false;
    if(target&&target.ref===mt)target=null;
  }
}
function dealTo(kind,ref,dmg,crit,hex){if(kind==='m')hitMonster(ref,dmg,crit,hex);else hitMetin(ref,dmg,crit,hex)}
function rollDmg(base,mul){
  var d=base*(mul||1)*R(0.85,1.15),crit=Math.random()<(0.10 + totalEfsun('crit')/100);
  if(crit)d*=1.8;
  return {d:Math.max(1,Math.round(d)),crit:crit};
}
function forEnemies(cb){
  for(var i=0;i<monsters.length;i++){var m=monsters[i];if(!m.dead)cb('m',m,m.t.r)}
  for(var j=0;j<metins.length;j++){var mt=metins[j];if(mt.alive)cb('x',mt,34)}
}
function hitArea(cx,cy,radius,mul,hex,fn){
  var n=0;
  forEnemies(function(k,e,rad){
    if(dist(e.x,e.y,cx,cy)<radius+rad){
      var r=rollDmg(pAtk(),mul);dealTo(k==='m'?'m':'x',e,r.d,r.crit,hex);n++;
      if(fn)fn(k,e);
    }
  });
  return n;
}
function faceTo(x,y){face=Math.atan2(x-S.x,y-S.y)}
function dirVec(f){return [Math.sin(f),Math.cos(f)]}
function pPos3(){return [S.x*SC,hAt(S.x,S.y),S.y*SC]}

function toggleMount(){
  mounted = !mounted;
  addLog(mounted ? 'Bineğe binildi! (Hız Katlandı)' : 'Binekten inildi.');
  $('mountTxt').textContent = mounted ? 'At Üstünde' : 'Yaya';
}

function playerAttack(){
  if(!target)return;
  var r=rollDmg(pAtk(),1);swing=1;atkCd=0.50;
  faceTo(target.ref.x,target.ref.y);
  dealTo(target.kind==='m'?'m':'x',target.ref,r.d,r.crit);
}

function nearestTarget(maxD){
  var best=null,bd=maxD||1200;
  for(var i=0;i<monsters.length;i++){var m=monsters[i];if(m.dead)continue;var d=dist(m.x,m.y,S.x,S.y);if(d<bd){bd=d;best={kind:'m',ref:m}}}
  for(var j=0;j<metins.length;j++){var mt=metins[j];if(!mt.alive)continue;var d2=dist(mt.x,mt.y,S.x,S.y)-20;if(d2<bd){bd=d2;best={kind:'x',ref:mt}}}
  return best;
}
function validTarget(tg){return tg&&((tg.kind==='m'&&!tg.ref.dead)||(tg.kind==='x'&&tg.ref.alive))}

/* KILIÇ FIRLATMA (PROJ) DÜZELTİLDİ */
function updateProjectiles(dt){
  for(var i=projs.length-1;i>=0;i--){
    var p=projs[i];p.d+=600*dt;
    var px=p.x+p.dx*p.d, py=p.y+p.dy*p.d;
    var p3=[px*SC,hAt(px,py)+1.2,py*SC];
    sparks(p3[0],p3[1],p3[2],p.hex,4,3,1.5,0.3,3);
    
    forEnemies(function(k,e,rad){
      if(p.hit.indexOf(e)<0&&dist(e.x,e.y,px,py)<55+rad){
        p.hit.push(e);var r=rollDmg(pAtk(),p.mul);dealTo(k,e,r.d,r.crit,p.hex);
        fxBurst(p3[0],p3[1],p3[2],p.hex,0.5,3.0,0.3);
      }
    });
    if(p.d>900){projs.splice(i,1)}
  }
}

function useSkill(i){
  if(dead)return;
  var SK = getSK();
  var sk = SK[i];
  if(S.lv<sk.lv){addLog(sk.n+' için Sv '+sk.lv+' gerekli');return}
  if(S.mp<sk.mp){addLog('Yeterli Mana yok');return}
  var p=pPos3(),mul=skMul(i),hex=new THREE.Color(sk.col).getHex();

  if(sk.type==='single'){
    var tg=validTarget(target)?target:nearestTarget(800);
    if(!tg){addLog('Yakında hedef yok');return}
    S.mp-=sk.mp;
    faceTo(tg.ref.x,tg.ref.y);swing=1;
    var q=enemyPos(tg.ref),r=rollDmg(pAtk(),mul);
    fxPillar(q[0],q[1],q[2],hex,10,1.0,0.7);
    fxBurst(q[0],q[1]+1,q[2],hex,0.4,3.2,0.45);
    shakeCam(0.35);
    dealTo(tg.kind==='m'?'m':'x',tg.ref,r.d,r.crit,hex);
  }else if(sk.type==='proj'){
    var tg2=validTarget(target)?target:nearestTarget(800);
    S.mp-=sk.mp;swing=1;
    if(tg2)faceTo(tg2.ref.x,tg2.ref.y);
    var dv=dirVec(face);
    projs.push({x:S.x+dv[0]*20,y:S.y+dv[1]*20,dx:dv[0],dy:dv[1],d:0,hit:[],mul:mul,hex:hex});
    addLog(sk.n+' fırlatıldı!');
  }else if(sk.type==='spin'||sk.type==='aoe'){
    S.mp-=sk.mp;spinA=1;
    fxRing(p[0],p[1],p[2],hex,0.5,7.5,0.5);
    fxBurst(p[0],p[1]+1,p[2],hex,0.5,6,0.5);
    var n=hitArea(S.x,S.y,160,mul,hex);
    if(n)shakeCam(0.3);
  }else if(sk.type==='buff'){
    S.mp-=sk.mp;castA=1;
    buff=12;fxRing(p[0],p[1],p[2],hex,0.5,6,0.6);
    addLog(sk.n+' Aktif!');
  }else if(sk.type==='dash'){
    var dx,dy;
    if(validTarget(target)){dx=target.ref.x-S.x;dy=target.ref.y-S.y}
    else{var dv2=dirVec(face);dx=dv2[0];dy=dv2[1]}
    var l=Math.sqrt(dx*dx+dy*dy)||1;
    S.mp-=sk.mp;
    charge={t:0,dur:0.28,dx:dx/l,dy:dy/l,hit:[],hex:hex};
    face=Math.atan2(charge.dx,charge.dy);moveTo=null;
    shakeCam(0.2);
  }
}

function step(e,tx,ty,speed,dt){
  var dx=tx-e.x,dy=ty-e.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d<1)return 0;
  var mv=Math.min(d,speed*dt);
  e.x+=dx/d*mv;e.y+=dy/d*mv;
  return d-mv;
}
function clampWorld(e){var r=Math.sqrt(e.x*e.x+e.y*e.y);if(r>WORLD_R){e.x*=WORLD_R/r;e.y*=WORLD_R/r}}

function update(dt){
  T+=dt;S.play+=dt;animT+=dt;
  if(buff>0)buff-=dt;
  if(potCd>0)potCd-=dt;
  if(atkCd>0)atkCd-=dt;
  if(swing>0)swing=Math.max(0,swing-dt*3.4);
  if(castA>0)castA=Math.max(0,castA-dt*1.6);
  if(spinA>0)spinA=Math.max(0,spinA-dt*2.8);
  var moved=false;

  var speedBonus = stoneBonus('speed') * 2.5;
  var currentSpeed = (175 + speedBonus) * (mounted ? 2.5 : 1.0);

  updateProjectiles(dt);

  if(!dead){
    if(S.autoHpOn && S.autoHpPot > 0 && S.hp < maxHp()*0.65){
      var heal = Math.min(S.autoHpPot, Math.round(maxHp()*0.15));
      S.hp = Math.min(maxHp(), S.hp + heal);
      S.autoHpPot -= heal;
      addFloat(S.x,S.y,'+'+heal+' [Oto HP]','#ff8a7a',false,2.2);
    }
    if(S.autoMpOn && S.autoMpPot > 0 && S.mp < maxMp()*0.5){
      var manaHeal = Math.min(S.autoMpPot, Math.round(maxMp()*0.2));
      S.mp = Math.min(maxMp(), S.mp + manaHeal);
      S.autoMpPot -= manaHeal;
      addFloat(S.x,S.y,'+'+manaHeal+' [Oto MP]','#8ab0ff',false,2.2);
    }
  }

  if(!dead){
    if(charge){
      charge.t+=dt;
      var cs=1200*dt;S.x+=charge.dx*cs;S.y+=charge.dy*cs;clampWorld(S);moved=true;
      forEnemies(function(k,e,rad){
        if(charge.hit.indexOf(e)<0&&dist(e.x,e.y,S.x,S.y)<85+rad){
          charge.hit.push(e);var r=rollDmg(pAtk(),skMul(4));dealTo(k,e,r.d,r.crit,charge.hex||0xffffff);
          if(k==='m')e.stun=1.5;shakeCam(0.25);
        }
      });
      if(charge.t>=charge.dur){charge=null}
    }else{
      var kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
      var ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
      if(kx||ky){
        var fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=-fz,rz=fx;
        var wx=fx*(-ky)+rx*kx,wy=fz*(-ky)+rz*kx,l=Math.sqrt(wx*wx+wy*wy)||1;
        S.x+=wx/l*currentSpeed*dt;S.y+=wy/l*currentSpeed*dt;clampWorld(S);
        face=Math.atan2(wx,wy);target=null;moveTo=null;moved=true;
      }else if(validTarget(target)){
        var tr=target.ref,rad=target.kind==='m'?tr.t.r:34,d=dist(S.x,S.y,tr.x,tr.y);
        if(d<=60+rad){
          faceTo(tr.x,tr.y);
          if(atkCd<=0)playerAttack();
        }else{faceTo(tr.x,tr.y);step(S,tr.x,tr.y,currentSpeed,dt);clampWorld(S);moved=true}
      }else if(target){target=null}
      else if(moveTo){
        faceTo(moveTo.x,moveTo.y);
        var rem=step(S,moveTo.x,moveTo.y,currentSpeed,dt);moved=true;
        if(rem<4)moveTo=null;clampWorld(S);
      }
      
      if(autoHunt&&!target&&!moveTo&&!kx&&!ky){
        var nt=nearestTarget(1400);if(nt)target=nt;
      }
    }
    var inSafe=dist(S.x,S.y,0,0)<SAFE_R;
    S.mp=Math.min(maxMp(),S.mp+maxMp()*0.02*dt*(inSafe?4:1));
    if(T-lastHit>5||inSafe)S.hp=Math.min(maxHp(),S.hp+maxHp()*(inSafe?0.1:0.01)*dt);
  }
  pMove+=((moved?1:0)-pMove)*Math.min(1,dt*10);

  var alive=0;
  for(var a2=monsters.length-1;a2>=0;a2--){
    var m=monsters[a2];
    if(m.flash>0)m.flash-=dt;
    if(m.dead){
      m.deadT+=dt;
      if(T>m.respawn){
        removeMonster(m);
        monsters.splice(a2,1);
        spawnRandom(true);
      }
      continue;
    }
    alive++;m.anim+=dt*6;
    var dp=dist(m.x,m.y,S.x,S.y),t=m.t,ox=m.x,oy=m.y;
    if(m.stun>0){m.stun-=dt;m.mv=0;continue}
    var passive=t.lvl<S.lv-6;
    if(m.st==='idle'){
      if(!dead&&!passive&&dp<t.aggro&&dist(S.x,S.y,0,0)>=SAFE_R)m.st='chase';
      else{
        m.wt-=dt;
        if(m.wt<=0){m.wt=R(2,6);m.wx=m.hx+R(-80,80);m.wy=m.hy+R(-80,80)}
        if(dist(m.x,m.y,m.wx,m.wy)>4){m.face=Math.atan2(m.wx-m.x,m.wy-m.y);step(m,m.wx,m.wy,t.spd*0.4,dt)}
      }
      if(m.hp<m.max)m.hp=Math.min(m.max,m.hp+m.max*0.05*dt);
    }else if(m.st==='chase'){
      if(dead||dist(S.x,S.y,0,0)<SAFE_R||dist(m.x,m.y,m.hx,m.hy)>650){m.st='idle';m.wx=m.hx;m.wy=m.hy;continue}
      if(m.cd>0)m.cd-=dt;
      m.face=Math.atan2(S.x-m.x,S.y-m.y);
      if(dp>t.r+26){step(m,S.x,S.y,t.spd,dt);}
      else if(m.cd<=0){
        m.cd=1.2;
        var dmg=Math.max(1,Math.round(t.atk*R(0.8,1.2)*50/(50+aDef())));
        S.hp-=dmg;lastHit=T;addFloat(S.x,S.y,'-'+dmg,'#ff6a5a',false,2.6);
        m.lunge=0.3;shakeCam(0.1);
        if(S.hp<=0){S.hp=0;die()}
      }
    }
    if(m.lunge>0)m.lunge-=dt;
    var moveD=dist(ox,oy,m.x,m.y)/Math.max(dt,0.001);m.mv+=((moveD>5?1:0)-m.mv)*Math.min(1,dt*8);
  }
  
  if(alive<TARGET_MONSTERS&&Math.random()<dt*2)spawnRandom(true);

  for(var b=0;b<metins.length;b++){
    var mt=metins[b];if(mt.flash>0)mt.flash-=dt;
    if(!mt.alive&&T>mt.resp){
      mt.alive=true;mt.hp=mt.max;mt.step=0;mt.mo.g.visible=true;
      if(!mt.label) mt.label = createMobLabel('Metin Taşı', (mt.zi*5+5), true);
    }
  }

  for(var c=drops.length-1;c>=0;c--){
    var dr=drops[c];dr.t+=dt;
    if(!dead&&dist(dr.x,dr.y,S.x,S.y)<50){
      if(dr.kind==='gold'){S.gold+=dr.amt;addFloat(dr.x,dr.y,'+'+dr.amt+' yang','#ffd36b',false,1.4)}
      else if(dr.kind==='item')addItem(dr.item);
      else if(dr.kind==='bless'){S.blessPaper++;addLog('Kutsama Kağıdı Düştü!')}
      else if(dr.kind==='efsunObj'){S.efsunObj++;addLog('Efsun Nesnesi Düştü!')}
      else if(dr.kind==='efsunAdd'){S.efsunAdd++;addLog('Arttırma Kağıdı Düştü!')}
      else if(dr.kind==='hp'){S.hpPot++;addLog('Can iksiri toplandı')}
      else if(dr.kind==='mp'){S.mpPot++;addLog('Mana iksiri toplandı')}
      freeDrop(dr);drops.splice(c,1);
    }else if(dr.t>120){freeDrop(dr);drops.splice(c,1)}
  }
}

    }else{mt.label.style.display='none'}
  }
}

function syncVisuals(dt){
  var p=pPos3();
  faceR+=angDiff(face,faceR)*Math.min(1,dt*16);
  var pm=playerModel;
  
  if(mounted && mountModel){
    mountModel.g.visible=true;
    mountModel.g.position.set(p[0],p[1],p[2]);
    mountModel.g.rotation.y=faceR;
    pm.g.position.set(p[0],p[1]+0.8,p[2]);
  }else{
    if(mountModel)mountModel.g.visible=false;
    pm.g.position.set(p[0],p[1],p[2]);
  }
  
  pm.g.rotation.y=faceR+spinA*Math.PI*2*(spinA>0?1:0);
  animHuman(pm,animT,pMove,swing,castA);

  _v.set(p[0], p[1] + (mounted?3.2:2.5), p[2]).project(camera);
  if(_v.z <= 1){
    var sx = (_v.x * 0.5 + 0.5) * W;
    var sy = (-_v.y * 0.5 + 0.5) * H;
    $('playerLabel').style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0) translate(-50%,-100%)';
  }

  sun.position.set(p[0]+28,p[1]+46,p[2]+18);sun.target.position.set(p[0],p[1],p[2]);sun.target.updateMatrixWorld();
  sky.position.set(p[0],0,p[2]);

  for(var i=0;i<monsters.length;i++){
    var m=monsters[i],g=m.mo.g,h=hAt(m.x,m.y);
    g.position.set(m.x*SC,h,m.y*SC);
    g.rotation.y=m.face;
    if(m.dead){
      var k=Math.min(1,m.deadT/0.5);g.rotation.z=k*1.45;g.position.y=h-Math.max(0,m.deadT-2.5)*0.8;
      if(m.flash>0){setFlash(m.mo,true)}else if(m.mo.flashOn){setFlash(m.mo,false)}
      m.mo.flashOn=m.flash>0;continue;
    }
    if(m.mo.kind==='b')animBeast(m.mo,animT+m.anim,m.mv);
    else animHuman(m.mo,animT+m.anim,m.mv,m.lunge>0?m.lunge/0.3:0,0);
    var fl=m.flash>0;if(fl!==!!m.mo.flashOn){setFlash(m.mo,fl);m.mo.flashOn=fl}
    var showBar=(m.hp<m.max)||(target&&target.ref===m);
    if(showBar)setBar(m.bar,m.hp/m.max,true);else setBar(m.bar,0,false);
  }

  for(var j=0;j<metins.length;j++){
    var mt=metins[j];if(!mt.alive)continue;
    var P=mt.mo.P;
    P.crystal.rotation.y=animT*0.8+j;
    var fl2=mt.flash>0;if(fl2!==!!mt.mo.flashOn){setFlash(mt.mo,fl2);mt.mo.flashOn=fl2}
    var sb=mt.hp<mt.max||(target&&target.ref===mt);
    if(sb)setBar(mt.bar,mt.hp/mt.max,true);else setBar(mt.bar,0,false);
  }

  for(var d=0;d<drops.length;d++){
    var dr=drops[d],o=dr.obj;
    o.position.y=hAt(dr.x,dr.y)+0.7+Math.sin(dr.t*3)*0.12;
    if(dr.spin)dr.spin.rotation.y=dr.t*2.5;
  }

  if(validTarget(target)){
    var tr=target.ref,tp=enemyPos(tr),rr=target.kind==='m'?tr.t.r*SC*1.6*tr.t.sc*0.8+0.4:2.2;
    selRing.visible=true;selRing.position.set(tp[0],tp[1]+0.12,tp[2]);selRing.scale.set(rr,rr,rr);
  }else selRing.visible=false;

  updateMobLabels();
}

function updateCamera(dt){
  if(keys.q)camYaw-=dt*1.8;if(keys.e)camYaw+=dt*1.8;
  var p=pPos3(),cp=Math.cos(camPitch),sp=Math.sin(camPitch);
  var cx=p[0]+Math.sin(camYaw)*cp*camDist,cz=p[2]+Math.cos(camYaw)*cp*camDist,cy=p[1]+1.6+sp*camDist;
  var gh=hAt(cx/SC,cz/SC)+0.8;if(cy<gh)cy=gh;
  if(shake>0){cx+=R(-1,1)*shake;cy+=R(-1,1)*shake;cz+=R(-1,1)*shake;shake=Math.max(0,shake-dt*1.8)}
  camera.position.set(cx,cy,cz);camera.lookAt(p[0],p[1]+1.5,p[2]);
}

function getRandomEfsun(){
  var e = EFSUN_LIST[Math.floor(Math.random()*EFSUN_LIST.length)];
  var val = RI(e.min, e.max);
  return {n:e.n, v:val, k:e.k};
}

$('pbody').addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('button[data-act]'):null;if(!el)return;
  var act=el.getAttribute('data-act'),i=parseInt(el.getAttribute('data-i'),10);

  if(act==='addEfsun'){
    var slot=el.getAttribute('data-slot'), item=S[slot];
    if(item && S.efsunAdd > 0){
      if(!Array.isArray(item.efs)) item.efs=[];
      if(item.efs.length < 3){
        item.efs.push(getRandomEfsun());
        S.efsunAdd--;
        addLog(itemName(item)+' itemine efsun eklendi!');
      }else{addLog('Maksimum 3 efsun ekleyebilirsin!')}
    }else{addLog('Arttırma Kağıdın kalmadı!')}
  }else if(act==='changeEfsun'){
    var slot2=el.getAttribute('data-slot'), item2=S[slot2];
    if(item2 && S.efsunObj > 0 && Array.isArray(item2.efs) && item2.efs.length > 0){
      for(var k=0;k<item2.efs.length;k++){item2.efs[k] = getRandomEfsun();}
      S.efsunObj--;
      addLog(itemName(item2)+' efsunları değiştirildi!');
    }else{addLog('En az 1 efsun olmalı!')}
  }else if(act==='addStoneM'||act==='addStoneX'||act==='addStoneL'||act==='addStoneS'){
    var slot3=el.getAttribute('data-slot'), item3=S[slot3];
    var type = act==='addStoneM'?'monster':(act==='addStoneX'?'metin':(act==='addStoneL'?'life':'speed'));
    var prop = act==='addStoneM'?'stMonster':(act==='addStoneX'?'stMetin':(act==='addStoneL'?'stLife':'stSpeed'));
    if(item3 && S[prop]>0){
      if(!Array.isArray(item3.stones)) item3.stones=[];
      if(item3.stones.length<2){
        item3.stones.push(type);
        S[prop]--;
        addLog(itemName(item3)+' eşyasına taş basıldı!');
      }else{addLog('En fazla 2 taş basılabilir!')}
    }else{addLog('Taşın kalmadı!')}
  }else if(act==='addOre'){
    var slot4=el.getAttribute('data-slot'), item4=S[slot4];
    if(item4 && S.oreJewel > 0){
      item4.socket = (item4.socket||0) + 1;
      S.oreJewel--;
      addLog(itemName(item4)+' takısına cevher eklendi!');
    }else{addLog('Cevherin kalmadı!')}
  }else if(act==='sortInv'){
    S.inv.sort(function(a,b){return itemValue(b) - itemValue(a);});
    addLog('Çanta en değerli eşyalara göre sıralandı.');
  }else if(act==='clearInv'){
    var totalVal = 0;
    for(var c=0;c<S.inv.length;c++){totalVal += itemValue(S.inv[c]);}
    S.gold += totalVal;
    S.inv = [];
    addLog('Tüm çanta satıldı: +'+fmt(totalVal)+' Yang');
  }else if(act==='addStat'){
    var st = el.getAttribute('data-st');
    if(S.statPts > 0){S.statPts--; S[st]++; S.hp = maxHp(); S.mp = maxMp();}
  }else if(act==='buyItem'){
    var itProp = el.getAttribute('data-item'), cost=parseInt(el.getAttribute('data-cost'),10);
    if(S.gold>=cost){S.gold-=cost; S[itProp]=(S[itProp]||0)+1; addLog('Satın alma başarılı!')}
  }else if(act==='equip'){
    var it=S.inv[i];if(!it)return;
    var slotKey = it.type==='w' ? 'weapon' : (it.type==='a' ? 'armor' : it.type);
    var old = S[slotKey];
    S[slotKey] = it;
    S.inv.splice(i,1);
    if(old)S.inv.push(old);
    rebuildPlayer();
  }else if(act==='unequip'){
    var slotKey2 = el.getAttribute('data-slot');
    if(S[slotKey2]){
      if(S.inv.length < INV_MAX){
        S.inv.push(S[slotKey2]);
        S[slotKey2] = null;
        rebuildPlayer();
      }
    }
  }else if(act==='sell'){
    var it2=S.inv[i];if(!it2)return;S.gold+=itemValue(it2);S.inv.splice(i,1);
  }else if(act==='skup'){
    var SK = getSK();
    if(S.sp<1||S.skl[i]>=SK_MAX||S.lv<SK[i].lv)return;
    S.sp--;S.skl[i]++;addLog(SK[i].n+' geliştirildi');
  }else if(act==='up'||act==='upBless'){
    var s=el.getAttribute('data-s'),item=S[s];if(!item||item.plus>=9)return;
    var c=upCost(item);if(S.gold<c)return;
    var isBless = act==='upBless';
    if(isBless && S.blessPaper<1)return;

    S.gold-=c;
    if(isBless) S.blessPaper--;

    if(Math.random()<RATES[item.plus]){
      item.plus++;
      upMsg='<div class="msg good">Başarılı! '+itemName(item)+'</div>';
    }else if(isBless){
      upMsg='<div class="msg bad">Başarısız! Kutsama kağıdı eşyayı korudu.</div>';
    }else{
      upMsg='<div class="msg bad">Başarısız!</div>';
    }
    rebuildPlayer();
  }
  renderPanel();
});

var ptrs={},dragMoved=0,pinch0=0,startCam=0;
function projScreen(x,y,z){_v.set(x,y,z).project(camera);return {x:(_v.x*0.5+0.5)*W,y:(-_v.y*0.5+0.5)*H,z:_v.z}}
function pickAt(sx,sy){
  var best=null,bd=1e9,fovK=(H/2)/Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  function test(kind,ref,hgt,rad){
    var e=enemyPos(ref),p=projScreen(e[0],e[1]+hgt*0.5,e[2]);
    if(p.z>1)return;
    var dd=camera.position.distanceTo(new THREE.Vector3(e[0],e[1]+hgt*0.5,e[2]));
    var rpx=Math.max(24,rad*fovK/dd),d=Math.hypot(sx-p.x,sy-p.y);
    if(d<rpx&&d<bd){bd=d;best={kind:kind,ref:ref}}
  }
  for(var i=0;i<monsters.length;i++){var m=monsters[i];if(!m.dead)test('m',m,m.mo.h,Math.max(0.9,m.mo.h*0.5))}
  for(var j=0;j<metins.length;j++){var mt=metins[j];if(mt.alive)test('x',mt,5,2.6)}
  return best;
}
function groundAt(sx,sy){
  var ndc=new THREE.Vector2(sx/W*2-1,-(sy/H)*2+1),rc=new THREE.Raycaster();
  rc.setFromCamera(ndc,camera);
  var o=rc.ray.origin,d=rc.ray.direction;
  if(d.y>=-0.01)return null;
  var py=hAt(S.x,S.y),t=(py-o.y)/d.y;
  return [(o.x+d.x*t)/SC,(o.z+d.z*t)/SC];
}
function handleClick(sx,sy){
  if(dead||!$('loginScreen').hidden)return;
  var best=pickAt(sx,sy);
  if(best){target=best;moveTo=null}
  else{
    var g=groundAt(sx,sy);if(!g)return;
    target=null;moveTo={x:g[0],y:g[1]};
    var r=Math.sqrt(g[0]*g[0]+g[1]*g[1]);if(r>WORLD_R){moveTo.x*=WORLD_R/r;moveTo.y*=WORLD_R/r}
  }
}
cv.addEventListener('contextmenu',function(e){e.preventDefault()});
cv.addEventListener('pointerdown',function(e){
  if(!$('loginScreen').hidden)return;
  var rc=cv.getBoundingClientRect();
  ptrs[e.pointerId]={x:e.clientX-rc.left,y:e.clientY-rc.top,sx:e.clientX-rc.left,sy:e.clientY-rc.top};
  var ids=Object.keys(ptrs);
  if(ids.length===1){dragMoved=0}
  if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch0=Math.hypot(a.x-b.x,a.y-b.y);startCam=camDist;dragMoved=99}
});
cv.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId];if(!p)return;
  var rc=cv.getBoundingClientRect(),nx=e.clientX-rc.left,ny=e.clientY-rc.top,dx=nx-p.x,dy=ny-p.y;
  p.x=nx;p.y=ny;
  var ids=Object.keys(ptrs);
  if(ids.length===1){
    dragMoved+=Math.abs(dx)+Math.abs(dy);
    if(dragMoved>10){camYaw-=dx*0.006;camPitch=Math.max(0.28,Math.min(1.25,camPitch+dy*0.004))}
  }else if(ids.length===2&&pinch0>0){
    var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
    camDist=Math.max(7,Math.min(26,startCam*pinch0/Math.max(20,d)));
  }
});
function endPtr(e,click){
  var p=ptrs[e.pointerId];if(!p)return;
  var wasSingle=Object.keys(ptrs).length===1;
  delete ptrs[e.pointerId];
  if(click&&wasSingle&&dragMoved<=10)handleClick(p.sx,p.sy);
}
cv.addEventListener('pointerup',function(e){endPtr(e,true)});
cv.addEventListener('pointercancel',function(e){endPtr(e,false)});
cv.addEventListener('wheel',function(e){e.preventDefault();camDist=Math.max(7,Math.min(26,camDist+e.deltaY*0.01))},{passive:false});

var prev=0,saveT=0;
function frame(ts){
  var dt=Math.min(0.05,(ts-prev)/1000||0.016);prev=ts;
  if($('loginScreen').hidden){
    update(dt);syncVisuals(dt);updateFx(dt);updateParticles(dt);updateCamera(dt);updateFloats(dt);
    renderer.render(scene,camera);updateHud();
    saveT+=dt;if(saveT>5){saveT=0;save()}
  }
  requestAnimationFrame(frame);
}
window.addEventListener('visibilitychange',function(){if(document.hidden)save()});
window.addEventListener('pagehide',save);

S=newState('AlazOflaz',0);
resize();
renderCharSelectGrid();
buildSkillButtons();
initWorld();
rebuildPlayer();
requestAnimationFrame(frame);
})();
</script>
